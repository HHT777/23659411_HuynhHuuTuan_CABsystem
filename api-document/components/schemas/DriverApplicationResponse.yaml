type: object
description: Đăng ký tài xế và trạng thái xét duyệt, tách biệt với trạng thái tài khoản và trạng thái sẵn sàng.
properties:
  id:
    type: string
    format: uuid
    pattern: ^[0-9a-fA-F-]{36}$
  driverId:
    type: string
    format: uuid
    pattern: ^[0-9a-fA-F-]{36}$
  registrationStatus:
    type: string
    enum: [PENDING_REVIEW, APPROVED, REJECTED]
  accountStatus:
    type: string
    enum: [PENDING_APPROVAL, ACTIVE, SUSPENDED]
  availability:
    type: string
    description: Luôn OFFLINE cho đến khi đăng ký được duyệt và tài xế chủ động bật nhận chuyến.
    enum: [OFFLINE, ONLINE]
  submittedAt:
    type: string
    format: date-time
  reviewedAt:
    type: string
    format: date-time
    nullable: true
  reviewNote:
    type: string
    maxLength: 500
    nullable: true
required: [id, driverId, registrationStatus, accountStatus, availability, submittedAt]

