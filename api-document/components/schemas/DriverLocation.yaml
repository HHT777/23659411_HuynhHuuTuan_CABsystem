DriverLocation:
  type: object
  description: "Vị trí mới nhất của tài xế (ENT-07)."
  required:
    - driverId
    - coordinates
  properties:
    driverLocationId:
      type: string
      description: "Mã bản ghi vị trí (PK)."
      example: "L-7001"
    driverId:
      type: string
      description: "Tài xế (FK -> Driver)."
      example: "D-3001"
    coordinates:
      type: string
      description: "Tọa độ vị trí (ví dụ: latitude,longitude)."
      example: "10.762622,106.660172"
    timestamp:
      type: string
      format: date-time
      description: "Thời điểm cập nhật vị trí."
