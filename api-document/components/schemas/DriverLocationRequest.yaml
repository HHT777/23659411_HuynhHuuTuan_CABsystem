type: object
description: Vị trí mới nhất của tài xế theo WGS84.
properties:
  latitude:
    type: number
    description: Vĩ độ WGS84.
    example: 10.7769
    format: double
    minimum: -90
    maximum: 90
  longitude:
    type: number
    description: Kinh độ WGS84.
    example: 106.7009
    format: double
    minimum: -180
    maximum: 180
required:
- latitude
- longitude
