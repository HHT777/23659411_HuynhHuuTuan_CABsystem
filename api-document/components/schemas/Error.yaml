Error:
  type: object
  description: "Cấu trúc lỗi chuẩn trả về cho mọi endpoint."
  properties:
    errorCode:
      type: string
      description: "Mã lỗi."
      example: "TRIP_NOT_FOUND"
    message:
      type: string
      description: "Mô tả lỗi (thân thiện với người dùng)."
      example: "Không tìm thấy chuyến đi."
    details:
      type: string
      description: "Chi tiết kỹ thuật (tùy chọn)."
