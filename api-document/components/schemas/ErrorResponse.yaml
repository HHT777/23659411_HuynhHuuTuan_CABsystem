type: object
description: Định dạng lỗi thống nhất của API.
properties:
  code:
    type: string
    description: Mã lỗi ổn định cho máy khách.
    example: PHONE_ALREADY_EXISTS
    minLength: 1
    maxLength: 100
  message:
    type: string
    description: Thông báo lỗi dễ đọc.
    example: Không thể xử lý yêu cầu.
    minLength: 1
    maxLength: 500
  details:
    type: array
    description: Danh sách chi tiết lỗi.
    items:
      $ref: ./ErrorDetail.yaml
    example:
    - field: phone
      reason: Số điện thoại đã tồn tại.
  requestId:
    type: string
    description: Mã truy vết yêu cầu.
    example: req_01J8QH8Y7W
    minLength: 1
    maxLength: 100
required:
- code
- message
- details
- requestId
