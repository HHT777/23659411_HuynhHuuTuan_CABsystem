type: object
description: Bảng giá có phiên bản cho một loại xe.
properties:
  version:
    type: string
    description: Phiên bản bảng giá duy nhất.
    example: fare-2026-02
    minLength: 1
    maxLength: 50
  vehicleType:
    type: string
    description: Loại xe áp dụng.
    example: MOTORCYCLE
    enum:
    - MOTORCYCLE
    - CAR_4
  openingFare:
    type: number
    description: Giá mở cửa bằng VND.
    example: 10000
    format: double
    minimum: 0
  includedKm:
    type: number
    description: Số km đã gồm trong giá mở cửa.
    example: 2
    format: double
    minimum: 0
    maximum: 100
  perKmFare:
    type: number
    description: Đơn giá cho mỗi km tiếp theo.
    example: 4000
    format: double
    minimum: 0
  effectiveFrom:
    type: string
    description: Thời điểm bảng giá có hiệu lực.
    example: '2026-10-01T00:00:00+07:00'
    format: date-time
required:
- version
- vehicleType
- openingFare
- includedKm
- perKmFare
- effectiveFrom
