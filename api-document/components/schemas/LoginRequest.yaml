type: object
description: Thông tin đăng nhập.
properties:
  phone:
    type: string
    description: Số điện thoại tài khoản.
    example: '+84901234567'
    minLength: 9
    maxLength: 15
    pattern: ^\+?[0-9]{9,15}$
  password:
    type: string
    description: Mật khẩu tài khoản.
    example: Cab@123456
    format: password
    minLength: 8
    maxLength: 72
required:
- phone
- password
