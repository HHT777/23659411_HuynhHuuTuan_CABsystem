Notification:
  type: object
  description: "Sự kiện thông báo (ENT-10)."
  required:
    - recipient
    - eventType
    - content
  properties:
    notificationId:
      type: string
      description: "Mã thông báo (PK)."
      example: "N-10001"
    recipient:
      type: string
      description: "Đối tượng nhận."
      enum:
        - customer
        - driver
      example: "customer"
    eventType:
      type: string
      description: "Sự kiện phát sinh thông báo."
      enum:
        - TIEP_NHAN
        - NHAN_CHUYEN
        - DEN_DIEM_DON
        - HOAN_THANH
        - THANH_TOAN
        - THANH_TOAN_THAT_BAI
        - KHONG_TIM_DUOC_TAI_XE
      example: "NHAN_CHUYEN"
    content:
      type: string
      description: "Nội dung thông báo."
      example: "Tài xế đã nhận chuyến của bạn."
    createdAt:
      type: string
      format: date-time
      description: "Thời điểm tạo thông báo."
    readAt:
      type: string
      format: date-time
      nullable: true
      description: "Thời điểm người dùng đọc thông báo."
