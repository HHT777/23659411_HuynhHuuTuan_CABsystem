type: object
description: Thông tin phân trang.
properties:
  page:
    type: integer
    description: Trang hiện tại, bắt đầu từ 1.
    example: 1
    format: int32
    minimum: 1
    maximum: 1000
  size:
    type: integer
    description: Số phần tử mỗi trang.
    example: 20
    format: int32
    minimum: 1
    maximum: 100
  totalItems:
    type: integer
    description: Tổng số phần tử.
    example: 42
    format: int64
    minimum: 0
  totalPages:
    type: integer
    description: Tổng số trang.
    example: 3
    format: int32
    minimum: 0
required:
- page
- size
- totalItems
- totalPages
