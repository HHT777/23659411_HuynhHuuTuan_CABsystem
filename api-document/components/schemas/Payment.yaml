Payment:
  type: object
  description: "Ghi nhận kết quả thanh toán (ENT-09). Không lưu dữ liệu thanh toán nhạy cảm (BR_12)."
  required:
    - tripId
    - method
  properties:
    paymentId:
      type: string
      description: "Mã giao dịch (PK)."
      example: "P-9001"
    tripId:
      type: string
      description: "Chuyến liên quan (FK -> Trip)."
      example: "T-6001"
    method:
      type: string
      description: "Phương thức thanh toán."
      enum:
        - TIEN_MAT
        - DIEN_TU
      example: "DIEN_TU"
    status:
      type: string
      description: "Kết quả thanh toán."
      enum:
        - THANH_CONG
        - THAT_BAI
      example: "THANH_CONG"
    createdAt:
      type: string
      format: date-time
      description: "Thời điểm giao dịch."
