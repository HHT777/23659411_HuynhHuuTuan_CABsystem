type: object
description: Các trường tài khoản chung mà Khách hàng hoặc Tài xế được phép cập nhật trực tiếp.
minProperties: 1
additionalProperties: false
properties:
  name:
    type: string
    description: Tên hiển thị mới.
    example: Nguyễn Văn Bình
    minLength: 2
    maxLength: 100
  phone:
    type: string
    description: Số điện thoại mới, phải duy nhất.
    example: '+84987654321'
    minLength: 9
    maxLength: 15
    pattern: ^\+?[0-9]{9,15}$
