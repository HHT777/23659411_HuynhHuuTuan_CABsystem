Rating:
  type: object
  description: "Đánh giá tài xế sau chuyến (ENT-11). Chỉ được đánh giá khi chuyến hoàn thành (BR_17)."
  required:
    - tripId
    - driverId
    - score
  properties:
    ratingId:
      type: string
      description: "Mã đánh giá (PK)."
      example: "RT-11001"
    tripId:
      type: string
      description: "Chuyến liên quan (FK -> Trip)."
      example: "T-6001"
    driverId:
      type: string
      description: "Tài xế được đánh giá (FK -> Driver)."
      example: "D-3001"
    score:
      type: integer
      format: int32
      description: "Điểm đánh giá (1 - 5)."
      minimum: 1
      maximum: 5
      example: 5
    comment:
      type: string
      description: "Nhận xét (tùy chọn)."
      example: "Tài xế thân thiện, xe sạch sẽ."
