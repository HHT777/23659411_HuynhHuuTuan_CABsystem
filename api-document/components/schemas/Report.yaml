ReportPeriod:
  type: object
  required: [from, to]
  properties:
    from:
      type: string
      format: date
    to:
      type: string
      format: date

OperationsReport:
  type: object
  required: [period, totalTrips, completedTrips, cancelledTrips]
  properties:
    period:
      $ref: "#/ReportPeriod"
    totalTrips:
      type: integer
      minimum: 0
    completedTrips:
      type: integer
      minimum: 0
    cancelledTrips:
      type: integer
      minimum: 0
    driverPerformance:
      type: array
      items:
        type: object
        properties:
          driverId:
            type: string
          completedTrips:
            type: integer
          averageRating:
            type: number
            format: double

RevenueReport:
  type: object
  required: [period, totalRevenue, currency]
  properties:
    period:
      $ref: "#/ReportPeriod"
    totalRevenue:
      type: number
      format: double
      minimum: 0
    currency:
      type: string
      enum: [VND]
