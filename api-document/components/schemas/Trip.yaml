Trip:
  type: object
  description: "Chuyến đi từ khi nhận tài xế đến hoàn thành (ENT-06)."
  required:
    - requestId
    - driverId
  properties:
    tripId:
      type: string
      description: "Mã chuyến (PK)."
      example: "T-6001"
    requestId:
      type: string
      description: "Yêu cầu gốc (FK -> RideRequest)."
      example: "R-5001"
    driverId:
      type: string
      description: "Tài xế nhận chuyến (FK -> Driver)."
      example: "D-3001"
    status:
      type: string
      description: "Trạng thái chuyến, chuyển đúng thứ tự quy trình (BR_07)."
      enum:
        - DA_DEN_DIEM_DON
        - DA_DON_KHACH
        - DANG_DI_CHUYEN
        - HOAN_THANH
        - DA_HUY
      example: "DA_DON_KHACH"
    latestDriverLocation:
      $ref: "../../openapi.yaml#/components/schemas/DriverLocation"
    fare:
      $ref: "../../openapi.yaml#/components/schemas/Fare"
