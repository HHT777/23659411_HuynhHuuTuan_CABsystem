openapi: 3.0.3
info:
  title: CAB System API
  version: 1.0.0
  description: |-
    Đặc tả API pilot được truy vết từ SRS.md, mục 18.9 và các quy tắc nghiệp vụ liên quan.
    Trên Swagger UI, operation được nhóm theo actor. Đăng nhập bằng `/api/v1/auth/login`, sao chép `accessToken`,
    chọn **Authorize** và nhập `Bearer <accessToken>`. Tag chỉ hỗ trợ điều hướng; `security`, `x-roles`, quyền sở hữu
    và phản hồi 401/403 mới mô tả quyền thực thi.
  license:
    name: Proprietary
    url: https://cab-system.invalid/license
  x-assumption: SRS không quy định URL giấy phép; miền .invalid được dùng làm placeholder tài liệu và phải được thay trước
    khi phát hành.
servers:
- url: /
  description: Cùng origin với trang tài liệu hoặc API gateway
tags:
- name: 01 - Công khai và Tích hợp
  description: Đăng ký, đăng nhập và callback sandbox; các operation công khai không dùng bearer token.
- name: 02 - Khách hàng (CUSTOMER)
  description: API dành cho Khách hàng; dữ liệu chuyến, yêu cầu và thông báo bị giới hạn theo quyền sở hữu.
- name: 03 - Tài xế (DRIVER)
  description: API dành cho Tài xế; chỉ thao tác hồ sơ của mình, lời mời và chuyến được phân công.
- name: 04 - Nhân viên vận hành (OPERATOR)
  description: Tra cứu và xử lý tác vụ vận hành theo quyền; không xóa dữ liệu hoặc sửa kết quả thanh toán.
- name: 05 - Ban lãnh đạo (EXECUTIVE)
  description: Chỉ xem báo cáo được cấp quyền; không có quyền cấu hình hoặc quản trị hệ thống.
- name: 06 - Quản trị viên (ADMIN)
  description: Quản lý vai trò, bảng giá và tác vụ quản trị nhạy cảm; các thay đổi được audit.
