openapi: 3.0.3
info:
  title: CAB System API
  version: 1.0.0
  description: Đặc tả API pilot được truy vết từ SRS.md, mục 18.9 và các quy tắc nghiệp vụ liên quan.
  license:
    name: Proprietary
    url: https://cab-system.invalid/license
  x-assumption: SRS không quy định URL giấy phép; miền .invalid được dùng làm placeholder tài liệu và phải được thay trước
    khi phát hành.
servers:
- url: /
  description: Cùng origin với trang tài liệu hoặc API gateway
tags:
- name: Authentication and Accounts
  description: Đăng ký, xác thực và hồ sơ tài khoản.
- name: Driver Profiles and Availability
  description: Hồ sơ và trạng thái sẵn sàng của tài xế.
- name: Ride Requests
  description: Tiếp nhận và tra cứu yêu cầu chuyến.
- name: Driver Matching and Dispatch
  description: Đề nghị chuyến và phản hồi của tài xế; thuật toán ghép chạy nội bộ.
- name: Trips and Tracking
  description: Vòng đời chuyến và theo dõi vị trí.
- name: Fare and Payments
  description: Cước chuyến và thanh toán.
- name: Notifications
  description: Thông báo in-app.
- name: Trip History and Ratings
  description: Lịch sử chuyến và đánh giá tài xế.
- name: Operations and Incident Support
  description: Quản lý vận hành, phân quyền, bảng giá và sự cố.
- name: Reporting
  description: Báo cáo vận hành tổng hợp.
security:
- bearerAuth: []
