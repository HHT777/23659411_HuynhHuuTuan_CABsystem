/auth/register:
  post:
    tags:
      - Auth
    summary: "Đăng ký tài khoản (UC-01)"
    operationId: register
    description: "Tạo tài khoản khách hàng hoặc tài xế."
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/RegisterRequest"
    responses:
      "201":
        description: "Tài khoản được tạo thành công."
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/User"
      "400":
        description: "Dữ liệu đầu vào không hợp lệ."
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "409":
        description: "Email/số điện thoại đã tồn tại."
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"

/auth/login:
  post:
    tags:
      - Auth
    summary: "Đăng nhập (UC-02)"
    operationId: login
    description: "Xác thực người dùng và cấp bearer token (JWT)."
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/LoginRequest"
    responses:
      "200":
        description: "Đăng nhập thành công, trả về token."
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/LoginResponse"
      "401":
        description: "Sai thông tin đăng nhập."
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
