/api/v1/notifications:
  get:
    tags:
    - Notifications
    operationId: listMyNotifications
    summary: Danh sách thông báo
    description: Trả thông báo in-app của tài khoản đang xác thực.
    x-srs-ref: UC-13; FR-09; FR-15; FR-18; FR-26; FR-27; BRULE-11
    x-roles:
    - CUSTOMER
    - DRIVER
    responses:
      '200':
        description: Danh sách thông báo.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/PaginatedNotificationResponse.yaml
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '403':
        $ref: ../components/responses/Forbidden.yaml
      '429':
        $ref: ../components/responses/TooManyRequests.yaml
      '500':
        $ref: ../components/responses/InternalServerError.yaml
    parameters:
    - $ref: ../components/parameters/Page.yaml
    - $ref: ../components/parameters/Size.yaml
/api/v1/notifications/{id}:
  patch:
    tags:
    - Notifications
    operationId: markNotificationRead
    summary: Đánh dấu thông báo đã đọc
    description: Chỉ người nhận sở hữu thông báo được cập nhật.
    x-srs-ref: UC-13; BRULE-11
    x-roles:
    - CUSTOMER
    - DRIVER
    responses:
      '200':
        description: Thông báo đã cập nhật.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/NotificationResponse.yaml
      '400':
        $ref: ../components/responses/BadRequest.yaml
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '403':
        $ref: ../components/responses/Forbidden.yaml
      '404':
        $ref: ../components/responses/NotFound.yaml
      '422':
        $ref: ../components/responses/UnprocessableEntity.yaml
      '500':
        $ref: ../components/responses/InternalServerError.yaml
    parameters:
    - $ref: ../components/parameters/ResourceId.yaml
    requestBody:
      required: true
      description: Dữ liệu yêu cầu.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/NotificationUpdateRequest.yaml
          example:
            read: true
