      - {$ref: ../components/parameters/Size.yaml}
    responses:
      '200':
        description: Danh sách phương tiện.
        content:
          application/json:
            schema:
              allOf:
                - {$ref: ../components/schemas/PaginatedResponse.yaml}
                - type: object
                  properties:
                    data:
                      type: array
                      items: {$ref: ../components/schemas/VehicleResponse.yaml}
      '401': {$ref: ../components/responses/Unauthorized.yaml}
      '403': {$ref: ../components/responses/Forbidden.yaml}
      '429': {$ref: ../components/responses/TooManyRequests.yaml}
      '500': {$ref: ../components/responses/InternalServerError.yaml}

/api/v1/operations/trips:
  get:
    tags: [04 - Nhân viên vận hành (OPERATOR), 06 - Quản trị viên (ADMIN)]
    operationId: listTripsForOperations
    summary: Vận hành tra cứu chuyến đi
    description: Tra cứu chuyến đang diễn ra hoặc lịch sử để hỗ trợ; không sửa trạng thái qua endpoint này.
    x-srs-ref: UC-16; FR-31..FR-35; BRULE-12..BRULE-14
    x-roles: [OPERATOR, ADMIN]
    parameters:
      - {$ref: ../components/parameters/Page.yaml}
      - {$ref: ../components/parameters/Size.yaml}
      - {$ref: ../components/parameters/From.yaml}
      - {$ref: ../components/parameters/To.yaml}
    responses:
      '200':
        description: Danh sách chuyến.
        content:
          application/json:
            schema: {$ref: ../components/schemas/PaginatedTripResponse.yaml}
      '400': {$ref: ../components/responses/BadRequest.yaml}
      '401': {$ref: ../components/responses/Unauthorized.yaml}
      '403': {$ref: ../components/responses/Forbidden.yaml}
      '422': {$ref: ../components/responses/UnprocessableEntity.yaml}
      '429': {$ref: ../components/responses/TooManyRequests.yaml}
      '500': {$ref: ../components/responses/InternalServerError.yaml}

/api/v1/operations/transactions:
  get:
    tags: [04 - Nhân viên vận hành (OPERATOR), 06 - Quản trị viên (ADMIN)]
    operationId: listTransactionsForOperations
    summary: Vận hành tra cứu lịch sử giao dịch
    description: Chỉ đọc trạng thái giao dịch phục vụ hỗ trợ; OPERATOR và ADMIN không được sửa kết quả thanh toán tại endpoint này.
    x-srs-ref: UC-16; UC-17; FR-31; FR-34; FR-35; BRULE-12..BRULE-14
    x-roles: [OPERATOR, ADMIN]
    parameters:
      - {$ref: ../components/parameters/Page.yaml}
      - {$ref: ../components/parameters/Size.yaml}
      - {$ref: ../components/parameters/From.yaml}
      - {$ref: ../components/parameters/To.yaml}
    responses:
      '200':
        description: Danh sách giao dịch không chứa dữ liệu thanh toán nhạy cảm.
        content:
          application/json:
            schema:
              allOf:
                - {$ref: ../components/schemas/PaginatedResponse.yaml}
                - type: object
                  properties:
                    data:
                      type: array
                      items: {$ref: ../components/schemas/PaymentResponse.yaml}
      '400': {$ref: ../components/responses/BadRequest.yaml}
      '401': {$ref: ../components/responses/Unauthorized.yaml}
      '403': {$ref: ../components/responses/Forbidden.yaml}
      '422': {$ref: ../components/responses/UnprocessableEntity.yaml}
      '429': {$ref: ../components/responses/TooManyRequests.yaml}
      '500': {$ref: ../components/responses/InternalServerError.yaml}
