    - $ref: ../components/parameters/ResourceId.yaml
    requestBody:
      required: true
      description: Dữ liệu yêu cầu.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/IncidentUpdateRequest.yaml
          example:
            status: RESOLVED
            resolution: Đã xác minh và hỗ trợ hai bên.

/api/v1/operations/customers:
  get:
    tags: [04 - Nhân viên vận hành (OPERATOR), 06 - Quản trị viên (ADMIN)]
    operationId: listCustomersForOperations
    summary: Vận hành tra cứu Khách hàng
    description: Chỉ trả dữ liệu cần cho nhiệm vụ hỗ trợ; không cấp quyền sửa hoặc xóa Khách hàng.
    x-srs-ref: UC-16; FR-31; FR-32; FR-35; BRULE-12..BRULE-14
    x-roles: [OPERATOR, ADMIN]
    parameters:
      - {$ref: ../components/parameters/Page.yaml}
      - {$ref: ../components/parameters/Size.yaml}
    responses:
      '200':
        description: Danh sách Khách hàng.
        content:
          application/json:
            schema:
              allOf:
                - {$ref: ../components/schemas/PaginatedResponse.yaml}
                - type: object
                  properties:
                    data:
                      type: array
                      items: {$ref: ../components/schemas/UserResponse.yaml}
      '401': {$ref: ../components/responses/Unauthorized.yaml}
      '403': {$ref: ../components/responses/Forbidden.yaml}
      '429': {$ref: ../components/responses/TooManyRequests.yaml}
      '500': {$ref: ../components/responses/InternalServerError.yaml}

/api/v1/operations/vehicles:
  get:
