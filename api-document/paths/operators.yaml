/operators:
  get:
    tags: [Operators]
    summary: Lấy danh sách nhân viên vận hành
    operationId: listOperators
    security:
      - bearerAuth: []
    responses:
      "200":
        description: Danh sách nhân viên vận hành.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../openapi.yaml#/components/schemas/Operator"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        description: Người dùng không có quyền vận hành.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
  post:
    tags: [Operators]
    summary: Tạo tài khoản nhân viên vận hành
    operationId: createOperator
    security:
      - bearerAuth: []
    description: "Phục vụ quản trị theo quyền được cấp; ma trận quyền chi tiết còn cần làm rõ (OI08)."
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/Operator"
    responses:
      "201":
        description: Nhân viên vận hành được tạo.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Operator"
      "400":
        description: Dữ liệu không hợp lệ.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "403":
        description: Người dùng không có quyền tạo nhân viên vận hành.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"

/operators/{operatorId}:
  get:
    tags: [Operators]
    summary: Lấy chi tiết nhân viên vận hành
    operationId: getOperator
    security:
      - bearerAuth: []
    parameters:
      - name: operatorId
        in: path
        required: true
        schema:
          type: string
    responses:
      "200":
        description: Thông tin nhân viên vận hành.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Operator"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
  put:
    tags: [Operators]
    summary: Cập nhật quyền nhân viên vận hành
    operationId: updateOperator
    security:
      - bearerAuth: []
    parameters:
      - name: operatorId
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/Operator"
    responses:
      "200":
        description: Thông tin nhân viên vận hành được cập nhật.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Operator"
      "403":
        description: Người dùng không có quyền cập nhật.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"

/operators/trips/{tripId}/support:
  post:
    tags: [Operators]
    summary: Hỗ trợ xử lý chuyến có lỗi (UC-16)
    operationId: supportTrip
    security:
      - bearerAuth: []
    parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [action, note]
            properties:
              action:
                type: string
                enum: [REASSIGN_DRIVER, CANCEL_TRIP, RESOLVE_ISSUE]
              note:
                type: string
    responses:
      "200":
        description: Đã ghi nhận hỗ trợ vận hành.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Trip"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        description: Người dùng không có quyền vận hành.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"

/audit-logs:
  get:
    tags: [AuditLogs]
    summary: Tra cứu audit log thao tác quan trọng
    operationId: listAuditLogs
    security:
      - bearerAuth: []
    parameters:
      - name: actorUserId
        in: query
        required: false
        schema:
          type: string
      - name: targetType
        in: query
        required: false
        schema:
          type: string
      - name: targetId
        in: query
        required: false
        schema:
          type: string
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date-time
    responses:
      "200":
        description: Danh sách audit log.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../openapi.yaml#/components/schemas/AuditLog"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        description: Người dùng không có quyền xem audit log.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
