/ratings:
  post:
    tags:
      - Ratings
    summary: "Đánh giá tài xế sau chuyến (UC-15)"
    operationId: createRating
    security:
      - bearerAuth: []
    description: "Khách chỉ được đánh giá khi chuyến hoàn thành (BR_17)."
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/Rating"
    responses:
      "201":
        description: "Đánh giá được ghi nhận."
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Rating"
      "400":
        description: "Chuyến chưa hoàn thành hoặc dữ liệu không hợp lệ."
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"

/ratings/{ratingId}:
  get:
    tags:
      - Ratings
    summary: "Lấy chi tiết đánh giá"
    operationId: getRating
    security:
      - bearerAuth: []
    parameters:
      - name: ratingId
        in: path
        required: true
        description: "Mã đánh giá."
        schema:
          type: string
    responses:
      "200":
        description: "Chi tiết đánh giá."
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Rating"
      "404":
        description: "Không tìm thấy đánh giá."
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
