/api/v1/ride-requests:
  post:
    tags:
    - Ride Requests
    operationId: createRideRequest
    summary: Tạo yêu cầu chuyến
    description: Ghi nhận điểm đón, điểm đến, loại xe và bắt đầu ghép tài xế nội bộ.
    x-srs-ref: UC-05; FR-07..FR-09; BRULE-03; RULE-02
    x-roles:
    - CUSTOMER
    responses:
      '201':
        description: Yêu cầu chuyến đã tạo.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/RideRequestResponse.yaml
      '400':
        $ref: ../components/responses/BadRequest.yaml
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '403':
        $ref: ../components/responses/Forbidden.yaml
      '409':
        $ref: ../components/responses/Conflict.yaml
      '422':
        $ref: ../components/responses/UnprocessableEntity.yaml
      '429':
        $ref: ../components/responses/TooManyRequests.yaml
      '500':
        $ref: ../components/responses/InternalServerError.yaml
    parameters:
    - $ref: ../components/parameters/IdempotencyKey.yaml
    requestBody:
      required: true
      description: Dữ liệu yêu cầu.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/RideRequestCreateRequest.yaml
          example:
            pickup:
              latitude: 10.7769
              longitude: 106.7009
              address: 1 Lê Duẩn, Quận 1, TP.HCM
            destination:
              latitude: 10.8022
              longitude: 106.7145
              address: Bình Thạnh, TP.HCM
            vehicleType: MOTORCYCLE
/api/v1/ride-requests/{id}:
  get:
    tags:
    - Ride Requests
    operationId: getRideRequest
    summary: Xem yêu cầu chuyến
    description: Chỉ khách hàng sở hữu được xem yêu cầu chuyến.
    x-srs-ref: UC-05; FR-08; BRULE-03
    x-roles:
    - CUSTOMER
    responses:
      '200':
        description: Chi tiết yêu cầu chuyến.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/RideRequestResponse.yaml
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '403':
        $ref: ../components/responses/Forbidden.yaml
      '404':
        $ref: ../components/responses/NotFound.yaml
      '500':
        $ref: ../components/responses/InternalServerError.yaml
    parameters:
    - $ref: ../components/parameters/ResourceId.yaml
