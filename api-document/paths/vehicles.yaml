/vehicles:
  get:
    tags:
      - Vehicles
    summary: "Lấy danh sách phương tiện (quản lý vận hành - UC-16)"
    operationId: listVehicles
    security:
      - bearerAuth: []
    responses:
      "200":
        description: "Danh sách phương tiện."
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../openapi.yaml#/components/schemas/Vehicle"
      "401":
        description: "Chưa xác thực."
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
  post:
    tags:
      - Vehicles
    summary: "Thêm phương tiện cho tài xế"
    operationId: createVehicle
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/Vehicle"
    responses:
      "201":
        description: "Phương tiện được tạo."
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Vehicle"
      "400":
        description: "Dữ liệu không hợp lệ."
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"

/vehicles/{vehicleId}:
  get:
    tags:
      - Vehicles
    summary: "Lấy phương tiện theo ID"
    operationId: getVehicle
    security:
      - bearerAuth: []
    parameters:
      - name: vehicleId
        in: path
        required: true
        description: "Mã phương tiện."
        schema:
          type: string
    responses:
      "200":
        description: "Thông tin phương tiện."
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Vehicle"
      "404":
        description: "Không tìm thấy phương tiện."
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
