BadRequest:
  description: Yêu cầu không hợp lệ
  content:
    application/json:
      schema:
        $ref: ./schemas.yaml#/Error
      example:
        code: BADREQUEST
        message: Yêu cầu không hợp lệ
Unauthorized:
  description: Chưa xác thực hoặc chữ ký không hợp lệ
  content:
    application/json:
      schema:
        $ref: ./schemas.yaml#/Error
      example:
        code: UNAUTHORIZED
        message: Chưa xác thực hoặc chữ ký không hợp lệ
Forbidden:
  description: Không có quyền
  content:
    application/json:
      schema:
        $ref: ./schemas.yaml#/Error
      example:
        code: FORBIDDEN
        message: Không có quyền
NotFound:
  description: Không tìm thấy tài nguyên
  content:
    application/json:
      schema:
        $ref: ./schemas.yaml#/Error
      example:
        code: NOTFOUND
        message: Không tìm thấy tài nguyên
Conflict:
  description: Xung đột trạng thái hoặc phiên bản
  content:
    application/json:
      schema:
        $ref: ./schemas.yaml#/Error
      example:
        code: CONFLICT
        message: Xung đột trạng thái hoặc phiên bản
Gone:
  description: Lời mời đã hết hiệu lực
  content:
    application/json:
      schema:
        $ref: ./schemas.yaml#/Error
      example:
        code: GONE
        message: Lời mời đã hết hiệu lực
UnprocessableEntity:
  description: Dữ liệu không thỏa quy tắc nghiệp vụ
  content:
    application/json:
      schema:
        $ref: ./schemas.yaml#/Error
      example:
        code: UNPROCESSABLEENTITY
        message: Dữ liệu không thỏa quy tắc nghiệp vụ
Locked:
  description: Đăng nhập tạm khóa
  content:
    application/json:
      schema:
        $ref: ./schemas.yaml#/Error
      example:
        code: LOCKED
        message: Đăng nhập tạm khóa
TooManyRequests:
  description: Vượt giới hạn yêu cầu
  content:
    application/json:
      schema:
        $ref: ./schemas.yaml#/Error
      example:
        code: TOOMANYREQUESTS
        message: Vượt giới hạn yêu cầu
  headers:
    Retry-After:
      description: Số giây chờ trước khi thử lại.
      schema:
        type: integer
        minimum: 1
      example: 60
