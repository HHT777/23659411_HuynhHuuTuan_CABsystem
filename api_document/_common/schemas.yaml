      - Bearer
    expiresIn:
      type: integer
      minimum: 1
  required:
  - accessToken
  - refreshToken
  - tokenType
  - expiresIn
  x-assumption: true
RefreshRequest:
  type: object
  properties:
    refreshToken:
      type: string
      minLength: 20
  required:
  - refreshToken
  x-assumption: true
ProfilePatch:
  type: object
  properties:
