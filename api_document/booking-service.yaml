        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /bookings/{id}/cancel:
    post:
      tags:
      - Booking
      operationId: cancelBooking
      summary: Hủy Booking đang SEARCHING
      description: Chỉ hủy được Booking `SEARCHING` (đóng Offer, release reservation, phát `booking.canceled`). Đã có Trip → 409 `TRIP_ALREADY_CREATED` + cancelEndpoint `/trips/{tripId}/cancel`. Accept đang phối hợp → 409 (đợi tripId rồi hủy qua Trip). reason bắt buộc (thiếu → 400).
      x-api-type: public
      x-source: SRS.md §6.8, §8.3 UC-15, §9 FR-22, §10 BRULE-15/16, §16.2, §16.2.1; microservice_design.md §5.5.2, §6.8, §9.6.2
      x-roles:
      - CUSTOMER(owner)
      x-grpc-rpc: cab.booking.v1.BookingService/CancelBooking
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Booking ID
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelRequest'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Booking CANCELED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelBookingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 409 — TRIP_ALREADY_CREATED (kèm cancelEndpoint), assignment đang phối hợp, hoặc request cùng key đang xử lý.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/TripAlreadyCreatedError'
                - $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 422 — Cùng key khác body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /offers:
    get:
      tags:
      - Offer
      operationId: listOffers
      summary: 'Driver: danh sách Offer của mình'
      description: Chỉ Offer của chính Driver (owner). Driver chưa duyệt/scope hạn chế → 403.
      x-api-type: public
      x-source: SRS.md §8.3 UC-13, §9 FR-18, §16.2, §16.2.1; microservice_design.md §5.5.2
      x-roles:
