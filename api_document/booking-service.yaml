      - bearerAuth: []
      responses:
        '200':
          description: Danh sách phân trang.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /offers/{id}:
    get:
      tags:
      - Offer
      operationId: getOffer
      summary: 'Driver: chi tiết Offer'
      description: pickup, dropoff, estimate, expiresAt; không lộ bí mật. Khác chủ → 403.
      x-api-type: public
      x-source: SRS.md §8.3 UC-13, §9 FR-18, §16.2; microservice_design.md §5.5.2
      x-roles:
      - DRIVER(owner)
      x-grpc-rpc: cab.booking.v1.BookingService/GetOffer
      parameters:
