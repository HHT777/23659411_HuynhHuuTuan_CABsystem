      x-api-type: health
      x-source: SRS.md §8.3 UC-01, §16.0 NFR-01, §16.2.1; microservice_design.md §9.5
      x-roles:
      - INTERNAL (X-Service-Token)
      x-todo: 'Chưa xác định trong SRS/microservice_design: response body của /health và /ready từng service không được tài liệu định nghĩa (chỉ /health/services của Gateway có schema {services,checkedAt})'
      security:
      - serviceToken: []
      servers:
      - url: http://localhost:{port}
        description: booking-service trực tiếp trong mạng cab-internal / local dev (cổng hiện tại của project; không publish ra host ở môi trường chuẩn).
        variables:
          port:
            default: '3003'
      responses:
        '200':
          description: Sẵn sàng.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  schemas:
    AcceptOfferResponse:
      type: object
      description: 200 {bookingId,tripId,driverId,status:ASSIGNED}.
      required:
      - bookingId
      - tripId
      - driverId
      - status
      properties:
        bookingId:
          type: string
          format: uuid
        tripId:
          type: string
          format: uuid
        driverId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - ASSIGNED
    Booking:
      type: object
      description: 'GET /bookings/{id}: {bookingId,customerId,status,vehicleType,tariffVersion,cancelable,cancelVia,activeTripId,driverId} (SRS §16.2.1 AUD-14).'
      required:
      - bookingId
      - customerId
      - status
      - vehicleType
      - cancelable
