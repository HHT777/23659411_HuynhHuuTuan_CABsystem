# booking-service — OpenAPI contract (generated; nguồn: SRS.md v3.6, microservice_design.md v3.7)
openapi: 3.0.3
info:
  title: CAB System — booking-service
  version: 1.0.0
  description: |-
    API contract của **booking-service** — Booking + Dispatch/Assignment (BC04/BC05, PostgreSQL cab_booking_db): ước tính giá, Booking, Offer, Assignment. Không tính Fare chính thức (Trip khóa Fare).

    Actor: CUSTOMER (đặt/xem/hủy Booking), DRIVER (xem/nhận/từ chối Offer), ADMIN (đọc Booking).

    Nguồn duy nhất: `SRS.md` (v3.6) và `microservice_design.md` (v3.7). Mọi operation có `x-source`; chi tiết chưa xác định được đánh dấu `x-todo`. YAML này là contract để implement (docx: 1 service = 1 YAML).

    Quy ước chung: JSON camelCase; ID UUID; thời gian UTC; tiền VND (bigint); error envelope `{error:{code,message},requestId}`; `X-Request-Id` xuyên REST/Kafka/log (NFR-02). Rate limit tại Gateway: vượt ngưỡng trả 429 + Retry-After (SEC-07); mặc định RATE_GENERAL 100/phút/userId (public theo IP) áp dụng cho mọi route — 429 chỉ được liệt kê riêng ở endpoint có cấu hình rate riêng. `x-api-type`: public = client gọi qua Gateway; internal = service↔service (/internal/**, Gateway trả 404 cho client); health = liveness/readiness có credential. `x-grpc-rpc` = RPC mà Gateway dùng để chuyển route này tới service (micro §2.6.3).
servers:
- url: http://localhost:{port}
  description: API Gateway (local development) — điểm vào của client/frontend cho public API (SRS §16.2).
  variables:
    port:
      default: '8000'
- url: http://localhost:{port}
  description: booking-service trực tiếp trong mạng cab-internal / local dev (cổng hiện tại của project; không publish ra host ở môi trường chuẩn).
  variables:
    port:
      default: '3003'
tags:
- name: Fare Estimate
  description: Ước tính giá (UC-10)
- name: Booking
  description: Đặt xe, xem, hủy (UC-11/12/15)
- name: Offer
  description: Driver phản hồi offer (UC-13)
- name: Health
  description: Liveness/readiness
x-kafka-events:
  description: 'Hợp đồng Kafka (event-driven) của service — KHÔNG phải HTTP endpoint (docx §10). Nguồn: SRS §12.1–12.3, micro §7. Envelope: EventEnvelope. Outbox/inbox at-least-once, manual commit, retry 1/5/25s rồi vào cab.dead-letter.'
  envelope:
    $ref: '#/components/schemas/EventEnvelope'
  produces:
  - eventType: booking.offer.created
    topic: booking.events
    partitionKey: bookingId
    consumers:
    - notification-service
    payload:
      $ref: '#/components/schemas/BookingOfferCreatedPayload'
  - eventType: booking.assigned
    topic: booking.events
    partitionKey: bookingId
    consumers:
    - driver-service
    - notification-service
    payload:
      $ref: '#/components/schemas/BookingAssignedPayload'
  - eventType: booking.canceled
    topic: booking.events
    partitionKey: bookingId
    consumers:
    - driver-service
    - notification-service
    payload:
      $ref: '#/components/schemas/BookingCanceledPayload'
  - eventType: booking.no_driver_found
    topic: booking.events
    partitionKey: bookingId
    consumers:
    - notification-service
    payload:
      $ref: '#/components/schemas/BookingNoDriverFoundPayload'
  consumes:
  - eventType: trip.assigned
    topic: trip.events
    producer: trip-service
    consumerGroup: booking-service.v1
    payload:
      $ref: '#/components/schemas/TripAssignedPayload'
    effect: Hoàn tất Offer ACCEPTED / Booking ASSIGNED / assignment DONE; hội tụ cùng tripId dù response REST đến trước/sau (micro §9.6.2).
  - eventType: trip.completed
    topic: trip.events
    producer: trip-service
    consumerGroup: booking-service.v1
    payload:
      $ref: '#/components/schemas/TripCompletedPayload'
    effect: Booking ASSIGNED→COMPLETED và giải phóng khóa Customer (SRS §6.7).
  - eventType: trip.canceled
    topic: trip.events
    producer: trip-service
    consumerGroup: booking-service.v1
    payload:
      $ref: '#/components/schemas/TripCanceledPayload'
    effect: Booking → CANCELED; không tự điều phối lại (SRS §6.8, BRULE-15).
x-outgoing-internal-calls:
- code: INT-03
  target: driver-service
  call: GET /internal/drivers/nearby
  when: Worker dispatch lấy ứng viên.
- code: INT-04
  target: driver-service
  call: POST /internal/drivers/{id}/reservations
  when: Reserve Driver trước khi ghi Offer PENDING.
- code: INT-05
  target: driver-service
  call: DELETE /internal/drivers/{id}/reservations/{reservationId}
  when: Release khi hủy/Offer kết thúc/tạo Trip thất bại xác định.
- code: INT-06
  target: trip-service
  call: POST /internal/trips
  when: Khi Driver accept Offer.
- code: INT-07
  target: trip-service
  call: GET /internal/customers/{id}/active-trip
  when: Trước khi tạo Booking.
paths:
  /fare-estimates:
    post:
      tags:
      - Fare Estimate
      operationId: estimateFare
      summary: Ước tính giá
      description: Kiểm vùng phục vụ (SERVICE_AREA), gọi Map adapter lấy distance/ETA (lỗi map → Haversine), tính estimate theo tariff_snapshots local (BIKE/SEDAN/SUV). Ngoài vùng → 422; snapshot tariff không khả dụng hoặc vehicleType chưa có tariff → 503 `TARIFF_NOT_CONFIGURED`, không tạo Booking/Trip. Không cần Idempotency-Key.
      x-api-type: public
      x-source: SRS.md §6.5, §8.3 UC-10, §9 FR-14, §16.2, §16.2.1; microservice_design.md §5.5.2, §6.5
      x-roles:
      - CUSTOMER
      x-grpc-rpc: cab.booking.v1.BookingService/EstimateFare
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FareEstimateRequest'
            example:
              pickup:
                lat: 10.7725
                lng: 106.698
              dropoff:
                lat: 10.78
                lng: 106.71
              vehicleType: BIKE
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Estimate và ETA (chưa phải Fare cuối).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FareEstimateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: 422 — Ngoài vùng phục vụ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /bookings:
    post:
      tags:
      - Booking
      operationId: createBooking
      summary: Đặt xe
      description: Kiểm Customer không có Booking SEARCHING/Trip hoạt động (INT-07 + unique index theo customerId), lưu `SEARCHING` + outbox; worker dispatch tuần tự tạo Offer. Thiếu key → 400; đang có Booking/Trip → 409; replay cùng key trả cùng bookingId; RATE_BOOKING 5/phút/userId → 429 + Retry-After (PC29).
      x-api-type: public
      x-source: SRS.md §6.5, §8.3 UC-11, §9 FR-15/16, §10 BRULE-08/10/21, §16.1 RATE_BOOKING, §16.2; microservice_design.md §5.5.2, §6.5, §9.6.1
      x-roles:
      - CUSTOMER
      x-grpc-rpc: cab.booking.v1.BookingService/CreateBooking
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingRequest'
            example:
              pickup:
                lat: 10.7725
                lng: 106.698
              dropoff:
                lat: 10.78
                lng: 106.71
              vehicleType: BIKE
      security:
      - bearerAuth: []
      responses:
        '201':
          description: Booking SEARCHING.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateBookingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 409 — Đang có Booking/Trip hoạt động, hoặc request cùng key đang xử lý.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 422 — Ngoài vùng phục vụ hoặc cùng key khác body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    get:
      tags:
      - Booking
      operationId: listBookings
      summary: Danh sách Booking
      description: 'Customer chỉ thấy Booking của mình (scope customerId từ JWT), sắp (requestedAt giảm dần, id tăng dần). Seed C1: total=5 (PC14).'
      x-api-type: public
      x-source: SRS.md §8.3 UC-12, §9 FR-17, §16.2; microservice_design.md §5.5.2
      x-roles:
      - CUSTOMER(owner)
      - ADMIN
      x-grpc-rpc: cab.booking.v1.BookingService/ListBookings
      x-todo: 'Chưa xác định trong SRS/microservice_design: cách Admin chọn customer khi list (SRS chỉ ghi ''scope customerId từ JWT'' và UC-12 ''CustomerId khác 403'')'
      parameters:
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/BookingStatus'
        description: Lọc trạng thái
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Danh sách phân trang.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /bookings/{id}:
    get:
      tags:
      - Booking
      operationId: getBooking
      summary: Chi tiết Booking
      description: Trả status và tripId khi đã gán; `cancelVia` chỉ nơi hủy. Customer khác → 403.
      x-api-type: public
      x-source: SRS.md §8.3 UC-11/12, §9 FR-17, §16.2, §16.2.1 AUD-14; microservice_design.md §5.5.2, §6.8
      x-roles:
      - CUSTOMER(owner)
