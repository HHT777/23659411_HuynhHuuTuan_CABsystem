    Coordinate:
      type: object
      description: Điểm đón/trả {lat,lng,address?} (SRS §16.2.1 DTO Tọa độ). Phải nằm trong SERVICE_AREA lat 10.35–11.20, lng 106.35–107.05 (SRS §16.1); ngoài vùng trả 422 (BRULE-08) nên KHÔNG đặt minimum/maximum trong schema để Swagger không đổi thành 400.
      required:
