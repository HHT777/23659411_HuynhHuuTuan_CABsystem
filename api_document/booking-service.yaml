              schema:
                $ref: '#/components/schemas/Offer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /offers/{id}/accept:
    post:
      tags:
      - Offer
      operationId: acceptOffer
      summary: 'Driver: nhận Offer'
      description: Khóa Offer/Booking, kiểm owner + expiry (OFFER_TTL), dùng reservation đã HELD, gọi INT-06 tạo Trip (commandKey bền vững, không giữ DB transaction khi gọi mạng). Hết hạn/đã đóng → 409; khác chủ → 403; timeout tạo Trip chưa rõ → không gán tài xế mới (503/409, retry cùng key).
      x-api-type: public
      x-source: SRS.md §6.6, §8.3 UC-13, §9 FR-19, §16.2; microservice_design.md §5.5.2, §6.6, §9.6.2
      x-roles:
      - DRIVER(owner)
      x-grpc-rpc: cab.booking.v1.BookingService/AcceptOffer
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Offer ID
      - $ref: '#/components/parameters/IdempotencyKey'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Booking ASSIGNED, Trip ASSIGNED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptOfferResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 409 — Request cùng Idempotency-Key đang xử lý (IN_PROGRESS) hoặc xung đột nghiệp vụ (BRULE-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 422 — Cùng Idempotency-Key nhưng body khác (BRULE-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /offers/{id}/reject:
    post:
      tags:
      - Offer
      operationId: rejectOffer
      summary: 'Driver: từ chối Offer'
      description: Offer → REJECTED; worker dispatch ứng viên kế tiếp (tuần tự, tối đa DISPATCH_MAX_OFFERS=5).
      x-api-type: public
      x-source: SRS.md §6.5, §8.3 UC-13, §9 FR-18, §16.2, §16.2.1; microservice_design.md §5.5.2
      x-roles:
      - DRIVER(owner)
      x-grpc-rpc: cab.booking.v1.BookingService/RejectOffer
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Offer ID
      - $ref: '#/components/parameters/IdempotencyKey'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Offer REJECTED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RejectOfferResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 409 — Request cùng Idempotency-Key đang xử lý (IN_PROGRESS) hoặc xung đột nghiệp vụ (BRULE-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 422 — Cùng Idempotency-Key nhưng body khác (BRULE-21).
          content:
            application/json:
