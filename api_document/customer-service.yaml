# customer-service — OpenAPI contract (generated; nguồn: SRS.md v3.6, microservice_design.md v3.7)
openapi: 3.0.3
info:
  title: CAB System — customer-service
  version: 1.0.0
  description: |-
    API contract của **customer-service** — Customer profile (BC02, PostgreSQL cab_customer_db). Mã hóa email/phone profile (AES-256-GCM). Tách riêng khỏi driver-service.

    Actor: CUSTOMER (owner), ADMIN; internal caller: identity-service.

    Nguồn duy nhất: `SRS.md` (v3.6) và `microservice_design.md` (v3.7). Mọi operation có `x-source`; chi tiết chưa xác định được đánh dấu `x-todo`. YAML này là contract để implement (docx: 1 service = 1 YAML).

    Quy ước chung: JSON camelCase; ID UUID; thời gian UTC; tiền VND (bigint); error envelope `{error:{code,message},requestId}`; `X-Request-Id` xuyên REST/Kafka/log (NFR-02). Rate limit tại Gateway: vượt ngưỡng trả 429 + Retry-After (SEC-07); mặc định RATE_GENERAL 100/phút/userId (public theo IP) áp dụng cho mọi route — 429 chỉ được liệt kê riêng ở endpoint có cấu hình rate riêng. `x-api-type`: public = client gọi qua Gateway; internal = service↔service (/internal/**, Gateway trả 404 cho client); health = liveness/readiness có credential. `x-grpc-rpc` = RPC mà Gateway dùng để chuyển route này tới service (micro §2.6.3).
servers:
- url: http://localhost:{port}
  description: API Gateway (local development) — điểm vào của client/frontend cho public API (SRS §16.2).
  variables:
    port:
      default: '8000'
- url: http://localhost:{port}
  description: customer-service trực tiếp trong mạng cab-internal / local dev (cổng hiện tại của project; không publish ra host ở môi trường chuẩn).
  variables:
    port:
      default: '3001'
tags:
- name: Customer
  description: Hồ sơ khách hàng (UC-04)
- name: Internal
  description: Internal REST do customer-service cung cấp (INT-01)
- name: Health
  description: Liveness/readiness
x-kafka-events:
  description: 'Hợp đồng Kafka (event-driven) của service — KHÔNG phải HTTP endpoint (docx §10). Nguồn: SRS §12.1–12.3, micro §7. Envelope: EventEnvelope. Outbox/inbox at-least-once, manual commit, retry 1/5/25s rồi vào cab.dead-letter.'
  envelope:
    $ref: '#/components/schemas/EventEnvelope'
  produces: []
  consumes: []
  producesNote: Không có event nghiệp vụ nào được catalog nguồn chốt cho service này; không tự tạo topic/event mới (micro §5.x.5).
  consumesNote: Không có subscription nghiệp vụ P1 theo catalog (micro §5.x.5).
paths:
  /customers/{id}:
    get:
      tags:
      - Customer
      operationId: getCustomer
      summary: Xem hồ sơ khách
      description: 'So khớp path `{id}` với `JWT.profileId`: owner nhận 200; Customer khác → 403; ADMIN đọc theo ma trận quyền (FR-04, UC-04). Token sửa → 401; không tồn tại → 404.'
      x-api-type: public
      x-source: SRS.md §8.3 UC-04, §9 FR-04, §16.2, §16.2.1 AUD-22, §16.3; microservice_design.md §5.3.2, §9.4.1
      x-roles:
      - CUSTOMER(owner)
      - ADMIN
      x-grpc-rpc: cab.customer.v1.CustomerService/GetCustomer
      parameters:
      - name: id
        in: path
        required: true
        description: Customer ID (profileId)
        schema:
          type: string
          format: uuid
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Hồ sơ được phép xem.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /internal/customers:
    post:
      tags:
      - Internal
      operationId: internalCreateCustomer
      summary: '[INT-01] Tạo Customer profile'
      description: identity-service gọi khi đăng ký Customer; idempotent theo userId (không tạo profile thứ hai cho cùng userId). Lưu raw fullName; mã hóa email/phone (SEC-02).
      x-api-type: internal
      x-internal-contract: INT-01
      x-allowed-callers:
      - identity-service
      x-source: SRS.md §6.1, §14.1 INT-01; microservice_design.md §2.4 INT-01, §5.3.3, §6.1
      x-roles:
      - 'INTERNAL: identity-service'
      x-todo: 'Chưa xác định trong SRS/microservice_design: status code khi replay cùng userId (INT-01 chỉ ghi ''idempotent theo userId'') và mã lỗi khi dữ liệu không hợp lệ'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerProfileRequest'
      security:
      - serviceToken: []
      servers:
      - url: http://localhost:{port}
        description: customer-service trực tiếp trong mạng cab-internal / local dev (cổng hiện tại của project; không publish ra host ở môi trường chuẩn).
        variables:
          port:
            default: '3001'
      responses:
        '201':
          description: Profile tạo (hoặc trả profile đã có của userId).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCustomerProfileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /health:
    get:
      tags:
      - Health
      operationId: health
      summary: Liveness
      description: 'Liveness: process sống; không gọi DB/Kafka/Redis (SRS §16.2.1 ''Ràng buộc ghi, bảo mật và readiness''). Health nội bộ có credential (micro §9.5).'
      x-api-type: health
      x-source: SRS.md §16.0 NFR-01, §16.2.1; microservice_design.md §5.x.3, §9.5
      x-roles:
      - INTERNAL (X-Service-Token)
      x-todo: 'Chưa xác định trong SRS/microservice_design: response body của /health và /ready từng service không được tài liệu định nghĩa (chỉ /health/services của Gateway có schema {services,checkedAt})'
      security:
      - serviceToken: []
      servers:
      - url: http://localhost:{port}
        description: customer-service trực tiếp trong mạng cab-internal / local dev (cổng hiện tại của project; không publish ra host ở môi trường chuẩn).
        variables:
          port:
            default: '3001'
      responses:
        '200':
          description: Process còn sống.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /ready:
    get:
      tags:
      - Health
      operationId: ready
      summary: Readiness
      description: 'Readiness: kiểm DB riêng và Kafka (NFR-01). Dependency DOWN → 503 (UC-01 AC-01.2, NFR-01). Runtime phải chứng minh 503 rồi hồi phục 200 khi dependency lên lại (SRS §16.2.1).'
      x-api-type: health
      x-source: SRS.md §8.3 UC-01, §16.0 NFR-01, §16.2.1; microservice_design.md §9.5
      x-roles:
      - INTERNAL (X-Service-Token)
      x-todo: 'Chưa xác định trong SRS/microservice_design: response body của /health và /ready từng service không được tài liệu định nghĩa (chỉ /health/services của Gateway có schema {services,checkedAt})'
      security:
      - serviceToken: []
      servers:
      - url: http://localhost:{port}
        description: customer-service trực tiếp trong mạng cab-internal / local dev (cổng hiện tại của project; không publish ra host ở môi trường chuẩn).
        variables:
          port:
            default: '3001'
      responses:
        '200':
          description: Sẵn sàng.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  schemas:
    CreateCustomerProfileRequest:
      type: object
      description: 'Body INT-01 (micro §6.1: userId, fullName raw, email, phone).'
      required:
      - userId
      - fullName
      - email
      - phone
      properties:
        userId:
          type: string
          format: uuid
          description: users.id; UNIQUE — idempotent theo userId
        fullName:
          type: string
          description: Raw; customer-service lưu raw và escape khi trả API.
        email:
          type: string
          format: email
        phone:
          type: string
    CreateCustomerProfileResponse:
      type: object
      description: '201 {customerId: profileId} (micro §6.1).'
      required:
      - customerId
      properties:
        customerId:
          type: string
          format: uuid
          description: profileId của Customer
    CustomerProfile:
      type: object
      description: Owner và ADMIN nhận đầy đủ {id,fullName,email,phone,createdAt} (SRS §16.2.1 AUD-22). Ví dụ fullName '<script>' trả '&lt;script&gt;' (PC26).
      required:
      - id
      - fullName
      - email
      - phone
      - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: Customer ID = JWT.profileId
        fullName:
          type: string
          description: Escape HTML tại output (SEC-04).
        email:
          type: string
          format: email
        phone:
          type: string
          description: E.164
        createdAt:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      description: Error envelope chuẩn {error:{code,message},requestId} (SRS §16.2.1 'Lỗi').
      required:
      - error
      - requestId
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              description: 'Mã lỗi nghiệp vụ. Các mã có căn cứ trong tài liệu: MISSING_IDEMPOTENCY_KEY, ACTIVE_OFFER_EXISTS, TRIP_ALREADY_CREATED, TARIFF_NOT_CONFIGURED. Các mã khác chưa được tài liệu liệt kê nên không đặt enum.'
            message:
              type: string
              description: Mô tả lỗi; không chứa SQL/stack trace/token/giấy tờ (SEC-10).
        requestId:
          type: string
          description: X-Request-Id/correlationId của request (NFR-02).
    EventEnvelope:
      type: object
      description: Envelope Kafka (SRS §12.2; micro §7.3). Nếu ghi ở schema khác thì lấy SRS làm chuẩn.
      required:
      - eventId
      - eventType
      - version
      - aggregateId
      - aggregateVersion
      - occurredAt
      - producer
      - correlationId
      - payload
      properties:
        eventId:
          type: string
          format: uuid
        eventType:
          type: string
          description: Dotted event name, vd trip.completed
        version:
          type: integer
          description: Version schema của envelope/payload (không phải TTL/config)
        aggregateId:
          type: string
          description: ID aggregate (vd tripId)
        aggregateVersion:
          type: integer
          description: Version aggregate của owner producer
        occurredAt:
          type: string
          format: date-time
          description: UTC ISO-8601
        producer:
          type: string
          description: Service producer, vd trip-service
        correlationId:
          type: string
          description: requestId
        payload:
          type: object
          description: Payload theo từng eventType; không chứa password/token/CCCD/phone plaintext.
  responses:
    BadRequest:
      description: 400 — Validation không hợp lệ, thiếu Idempotency-Key (MISSING_IDEMPOTENCY_KEY) hoặc client gửi trường không được phép (SRS §16.2 bảng mã HTTP).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 403 — Sai role, quyền sở hữu hoặc caller (SEC-06).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 404 — Không tìm thấy tài nguyên (SRS §16.2 bảng mã HTTP).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: 503 — Dependency unavailable; không suy diễn timeout = thất bại nghiệp vụ (SRS §16.2, NFR-07).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: 401 — Token/credential/chữ ký/timestamp không hợp lệ; sửa sub/role hoặc alg=none (SEC-05).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Access JWT RS256 do identity-service cấp (TTL 60 phút). Claims: iss, aud, sub (=users.id), role, profileId, accountStatus, scope, iat, exp, jti (SRS §16.2.1). Driver PENDING_APPROVAL/REJECTED chỉ có scope driver.application.read và notifications.read.'
    serviceToken:
      type: apiKey
      in: header
      name: X-Service-Token
      description: 'Internal REST credential: JWT HS256 với claims iss (service gọi), aud (service nhận), iat, exp (TTL 60s), jti (SRS §14.1, micro §2.3). Thiếu/sai → 401; caller không nằm trong allowlist → 403. Chỉ tồn tại trên mạng cab-internal; Gateway trả 404 cho mọi /internal/** từ client.'
