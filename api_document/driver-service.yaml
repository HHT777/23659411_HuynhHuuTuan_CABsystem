components:
  schemas:
    AdminDriverDetail:
      type: object
      description: Chi tiết hồ sơ cho Admin; giấy tờ được che (FR-09, UC-07).
      required:
      - driverId
      - status
      properties:
        driverId:
          type: string
          format: uuid
        fullName:
          type: string
        phone:
          type: string
          description: masked
        email:
          type: string
          description: masked
        citizenId:
          type: string
          description: Masked cho Admin (SRS §16.4)
        licenseNumber:
          type: string
          description: Masked cho Admin
        vehicle:
          $ref: '#/components/schemas/VehicleInfo'
        decision:
          type: string
          enum:
          - APPROVE
          - REJECT
          nullable: true
        status:
          type: string
          enum:
          - PENDING_APPROVAL
          - OFFLINE
          - REJECTED
        submittedAt:
          type: string
          format: date-time
        reviewedAt:
          type: string
          format: date-time
        rejectReason:
          type: string
      x-todo: 'Chưa xác định trong SRS/microservice_design: danh sách field chính xác và định dạng mask của chi tiết hồ sơ Admin'
    AvailabilityResponse:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - ONLINE
          - OFFLINE
          - BUSY
        updatedAt:
          type: string
          format: date-time
      x-todo: 'Chưa xác định trong SRS/microservice_design: body response PUT /drivers/me/availability (UC-08 chỉ ghi ''lưu status và updatedAt'')'
    BookingAssignedPayload:
      type: object
      required:
      - bookingId
      - tripId
      - driverId
      - customerId
      properties:
        bookingId:
          type: string
          format: uuid
        tripId:
          type: string
          format: uuid
        driverId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
    BookingCanceledPayload:
      type: object
      required:
      - bookingId
      - customerId
      - reason
      properties:
        bookingId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        driverId:
          type: string
          format: uuid
          description: Có khi Offer đã gửi
        reason:
          type: string
        reservationId:
          type: string
          format: uuid
    DriverApplication:
      type: object
      description: Hồ sơ/trạng thái duyệt của Driver.
      required:
      - driverId
      - decision
      - status
      properties:
        driverId:
          type: string
          format: uuid
        decision:
          type: string
          enum:
          - APPROVE
          - REJECT
          nullable: true
          description: null khi còn chờ duyệt.
        status:
          type: string
          enum:
          - PENDING_APPROVAL
          - OFFLINE
          - REJECTED
          description: Kết quả duyệt (driver_applications.status).
        submittedAt:
          type: string
          format: date-time
        reviewedAt:
          type: string
          format: date-time
        rejectReason:
          type: string
      x-todo: 'Chưa xác định trong SRS/microservice_design: danh sách field chính xác của DTO application (SRS chỉ ghi ''hồ sơ/trạng thái duyệt''; field lấy từ driver_applications)'
    DriverApplicationDecidedPayload:
      type: object
      required:
      - driverId
      - accountId
      - decision
      properties:
        driverId:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
