            code:
              type: string
              description: 'Mã lỗi nghiệp vụ. Các mã có căn cứ trong tài liệu: MISSING_IDEMPOTENCY_KEY, ACTIVE_OFFER_EXISTS, TRIP_ALREADY_CREATED, TARIFF_NOT_CONFIGURED. Các mã khác chưa được tài liệu liệt kê nên không đặt enum.'
            message:
              type: string
              description: Mô tả lỗi; không chứa SQL/stack trace/token/giấy tờ (SEC-10).
        requestId:
          type: string
          description: X-Request-Id/correlationId của request (NFR-02).
    EventEnvelope:
      type: object
      description: Envelope Kafka (SRS §12.2; micro §7.3). Nếu ghi ở schema khác thì lấy SRS làm chuẩn.
      required:
      - eventId
      - eventType
      - version
      - aggregateId
      - aggregateVersion
      - occurredAt
      - producer
      - correlationId
      - payload
      properties:
        eventId:
          type: string
          format: uuid
        eventType:
          type: string
          description: Dotted event name, vd trip.completed
        version:
          type: integer
          description: Version schema của envelope/payload (không phải TTL/config)
        aggregateId:
          type: string
          description: ID aggregate (vd tripId)
        aggregateVersion:
          type: integer
          description: Version aggregate của owner producer
        occurredAt:
          type: string
          format: date-time
          description: UTC ISO-8601
        producer:
          type: string
          description: Service producer, vd trip-service
        correlationId:
          type: string
          description: requestId
        payload:
          type: object
          description: Payload theo từng eventType; không chứa password/token/CCCD/phone plaintext.
    Fare:
      type: object
      description: Fare chính thức do trip-service tính và khóa lúc tạo Trip (SRS §16.2.1 Trip/Fare, BRULE-09).
      required:
      - amountVnd
      - currency
      - tariffVersion
      properties:
        amountVnd:
          type: integer
          description: Số tiền VND (bigint).
          format: int64
        currency:
          type: string
          enum:
          - VND
        tariffVersion:
          type: string
          description: Phiên bản tariff đã khóa (vd demo-v1 — micro §9.6.6 G03).
    LocationPoint:
      type: object
      description: Vị trí {lat,lng,recordedAt} (SRS §16.2.1 Nearby/Trip).
      required:
      - lat
      - lng
      properties:
        lat:
          type: number
        lng:
          type: number
        recordedAt:
          type: string
          format: date-time
          description: Thời điểm ghi nhận vị trí (UTC)
    NearbyDriver:
      type: object
      description: Item nearby {id,fullName,vehicleType,status,distanceM,location:{lat,lng,recordedAt}}, sắp (distanceM,id) tăng (AUD-04).
      required:
      - id
      - fullName
      - vehicleType
      - status
      - distanceM
      - location
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        vehicleType:
          $ref: '#/components/schemas/VehicleType'
        status:
          type: string
          enum:
          - ONLINE
          - OFFLINE
          - BUSY
        distanceM:
          type: number
          description: Khoảng cách Haversine (m)
        location:
          $ref: '#/components/schemas/LocationPoint'
    NearbyDriverPage:
      type: object
      description: Phân trang chuẩn {items,page,limit,total} (SRS §16.2.1, BRULE-23). page vượt tổng trả items:[].
      required:
      - items
      - page
      - limit
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NearbyDriver'
        page:
          type: integer
          description: Trang hiện tại
          minimum: 1
        limit:
          type: integer
          description: Số phần tử tối đa mỗi trang
          minimum: 1
          maximum: 50
        total:
          type: integer
          description: Tổng số kết quả sau authorization/filter, trước khi cắt trang (SRS §16.2.1)
          minimum: 0
    OtpRequest:
      type: object
      description: Body POST /drivers/otp/request.
      required:
      - phone
      - purpose
      properties:
        phone:
          type: string
          description: Số điện thoại E.164
        purpose:
          type: string
          enum:
          - DRIVER_REGISTRATION
    OtpRequestResponse:
      type: object
      description: 202 {challengeId}.
      required:
      - challengeId
      properties:
        challengeId:
          type: string
          format: uuid
    OtpVerifyRequest:
      type: object
      required:
      - challengeId
      - phone
      - code
      properties:
        challengeId:
          type: string
          format: uuid
        phone:
          type: string
        code:
          type: string
          description: 'Mã OTP. Sandbox: 123456 khi SANDBOX_MODE=true.'
    OtpVerifyResponse:
      type: object
      required:
      - registrationToken
      properties:
        registrationToken:
          type: string
          description: JWT HS256, TTL 15 phút, dùng một lần, gắn phone/purpose; không phải access token.
    RejectDriverRequest:
      type: object
      description: Body reject; reason ≤ COMMENT_REASON_MAX=500.
      required:
      - reason
      properties:
        reason:
          type: string
          description: Lý do từ chối; bắt buộc.
          minLength: 1
          maxLength: 500
    ReservationConfirmRequest:
      type: object
      description: Body INT-08.
      required:
      - tripId
      - bookingId
      - offerId
      - token
      - commandKey
      properties:
        tripId:
          type: string
          format: uuid
          description: preallocate bởi trip-service
        bookingId:
          type: string
          format: uuid
        offerId:
          type: string
          format: uuid
        token:
          type: string
        commandKey:
          type: string
    ReservationConfirmResponse:
      type: object
      description: 200 {tripId,driverSnapshot,vehicleType}.
      required:
      - tripId
      - driverSnapshot
      - vehicleType
      properties:
        tripId:
          type: string
          format: uuid
        driverSnapshot:
          $ref: '#/components/schemas/DriverSnapshot'
        vehicleType:
          $ref: '#/components/schemas/VehicleType'
    ReservationCreateRequest:
      type: object
      description: Body INT-04.
      required:
      - bookingId
      - offerId
      properties:
        bookingId:
          type: string
          format: uuid
        offerId:
          type: string
          format: uuid
          description: offerId preallocate bởi booking-service
    ReservationCreateResponse:
      type: object
      description: 201 {reservationId,token,expiresAt}; replay 200 với response đã lưu.
      required:
      - reservationId
      - token
      - expiresAt
      properties:
        reservationId:
          type: string
          format: uuid
        token:
          type: string
          description: 'Token reservation — nhạy cảm: lưu hash/mã hóa, không log.'
        expiresAt:
          type: string
          format: date-time
    SetAvailabilityRequest:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - ONLINE
          - OFFLINE
          description: BUSY chỉ do assignment/Trip, client không đặt.
    TripAssignedPayload:
      type: object
      required:
      - tripId
      - bookingId
      - customerId
      - driverId
      - driverSnapshot
      - fare
      properties:
        tripId:
          type: string
          format: uuid
        bookingId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        driverId:
          type: string
          format: uuid
        driverSnapshot:
          $ref: '#/components/schemas/DriverSnapshot'
        fare:
          $ref: '#/components/schemas/Fare'
    TripCanceledPayload:
      type: object
      required:
      - tripId
      - bookingId
      - customerId
      - driverId
      - reason
      - canceledBy
      properties:
        tripId:
          type: string
          format: uuid
        bookingId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        driverId:
          type: string
          format: uuid
        reason:
          type: string
        canceledBy:
          type: string
          description: 'Ai hủy. Chưa xác định trong SRS/microservice_design: tập giá trị canceledBy'
    TripCompletedPayload:
      type: object
      required:
      - tripId
      - bookingId
      - customerId
      - driverId
      - fare
      properties:
        tripId:
          type: string
          format: uuid
        bookingId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        driverId:
          type: string
          format: uuid
        fare:
          $ref: '#/components/schemas/Fare'
    TripReviewCreatedPayload:
      type: object
      required:
      - reviewId
      - tripId
      - driverId
      - stars
      properties:
        reviewId:
          type: string
          format: uuid
        tripId:
          type: string
          format: uuid
        driverId:
          type: string
          format: uuid
        stars:
          type: integer
          minimum: 1
          maximum: 5
    UpdateLocationRequest:
      type: object
      description: Body PUT /drivers/me/location (lat,lng,recordedAt?).
      required:
      - lat
      - lng
      properties:
        lat:
          type: number
        lng:
          type: number
        recordedAt:
          type: string
          format: date-time
          description: Tùy chọn; nếu thiếu server dùng thời điểm nhận (todo)
    VehicleInfo:
      type: object
      description: Thông tin xe {type,plate,model} (SRS §16.2.1).
      required:
      - type
      - plate
      - model
      properties:
        type:
          $ref: '#/components/schemas/VehicleType'
        plate:
          type: string
          description: Biển số
        model:
          type: string
          description: Mẫu xe
    VehicleType:
      type: string
      description: Loại xe (allowlist BIKE/SEDAN/SUV — SRS §16.2.1).
      enum:
      - BIKE
      - SEDAN
      - SUV
  responses:
    BadRequest:
      description: 400 — Validation không hợp lệ, thiếu Idempotency-Key (MISSING_IDEMPOTENCY_KEY) hoặc client gửi trường không được phép (SRS §16.2 bảng mã HTTP).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 403 — Sai role, quyền sở hữu hoặc caller (SEC-06).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 404 — Không tìm thấy tài nguyên (SRS §16.2 bảng mã HTTP).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: 503 — Dependency unavailable; không suy diễn timeout = thất bại nghiệp vụ (SRS §16.2, NFR-07).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: 429 — Vượt rate limit tại Gateway; kèm Retry-After (SEC-07).
      headers:
        Retry-After:
          description: Số giây đến thời điểm cửa sổ rate được mở lại (SRS §16.2.1).
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: 401 — Token/credential/chữ ký/timestamp không hợp lệ; sửa sub/role hoặc alg=none (SEC-05).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Bắt buộc cho lệnh ghi quan trọng (SEC-08, SRS §16.2.1 'Phạm vi Idempotency-Key'). Thiếu → 400 MISSING_IDEMPOTENCY_KEY. Cùng key + cùng body → trả lại response cũ; cùng key nhưng body khác → 422; đang xử lý → 409 (BRULE-21). TTL 24 giờ (IDEMPOTENCY_TTL).
      schema:
        type: string
        minLength: 16
        maxLength: 64
    Limit:
      name: limit
      in: query
      required: false
      description: Số phần tử mỗi trang (LIMIT_DEFAULT=20, LIMIT_MAX=50). Ngoài biên → 400.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    Page:
      name: page
      in: query
      required: false
      description: Số trang (PAGE_DEFAULT=1). Giá trị không hợp lệ → 400.
      schema:
        type: integer
        minimum: 1
        default: 1
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Access JWT RS256 do identity-service cấp (TTL 60 phút). Claims: iss, aud, sub (=users.id), role, profileId, accountStatus, scope, iat, exp, jti (SRS §16.2.1). Driver PENDING_APPROVAL/REJECTED chỉ có scope driver.application.read và notifications.read.'
    registrationToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'registrationToken: JWT HS256 do driver-service ký (REGISTRATION_TOKEN_KEY, TTL 15 phút, dùng một lần), claims sub,phoneHash,purpose=DRIVER_REGISTRATION,challengeId,jti,iss=driver-service,aud=identity-service,iat,exp. KHÔNG phải access token (SRS §6.2). Chưa xác định trong SRS/microservice_design: tài liệu chỉ ghi quyền ''PUBLIC + registrationToken''; chưa nói token đặt ở header Authorization hay trong body'
      x-todo: 'Chưa xác định trong SRS/microservice_design: vị trí truyền registrationToken (header Authorization hay body) — xem README mục Cần xác nhận'
    serviceToken:
      type: apiKey
      in: header
      name: X-Service-Token
      description: 'Internal REST credential: JWT HS256 với claims iss (service gọi), aud (service nhận), iat, exp (TTL 60s), jti (SRS §14.1, micro §2.3). Thiếu/sai → 401; caller không nằm trong allowlist → 403. Chỉ tồn tại trên mạng cab-internal; Gateway trả 404 cho mọi /internal/** từ client.'
