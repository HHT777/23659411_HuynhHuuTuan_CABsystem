# driver-service — OpenAPI contract (generated; nguồn: SRS.md v3.6, microservice_design.md v3.7)
openapi: 3.0.3
info:
  title: CAB System — driver-service
  version: 1.0.0
  description: |-
    API contract của **driver-service** — Driver, Vehicle, Availability, Location, OTP (BC03, PostgreSQL cab_driver_db; Redis OTP/GEO/reservation). Sở hữu hồ sơ CCCD/bằng lái (mã hóa), quy trình duyệt, tìm tài xế gần và reservation (lease) chống nhận trùng.

    Actor: PUBLIC (đăng ký OTP), DRIVER, CUSTOMER (xem public/nearby), ADMIN (duyệt hồ sơ); internal caller: booking-service, trip-service.

    Nguồn duy nhất: `SRS.md` (v3.6) và `microservice_design.md` (v3.7). Mọi operation có `x-source`; chi tiết chưa xác định được đánh dấu `x-todo`. YAML này là contract để implement (docx: 1 service = 1 YAML).

    Quy ước chung: JSON camelCase; ID UUID; thời gian UTC; tiền VND (bigint); error envelope `{error:{code,message},requestId}`; `X-Request-Id` xuyên REST/Kafka/log (NFR-02). Rate limit tại Gateway: vượt ngưỡng trả 429 + Retry-After (SEC-07); mặc định RATE_GENERAL 100/phút/userId (public theo IP) áp dụng cho mọi route — 429 chỉ được liệt kê riêng ở endpoint có cấu hình rate riêng. `x-api-type`: public = client gọi qua Gateway; internal = service↔service (/internal/**, Gateway trả 404 cho client); health = liveness/readiness có credential. `x-grpc-rpc` = RPC mà Gateway dùng để chuyển route này tới service (micro §2.6.3).
servers:
- url: http://localhost:{port}
  description: API Gateway (local development) — điểm vào của client/frontend cho public API (SRS §16.2).
  variables:
    port:
      default: '8000'
- url: http://localhost:{port}
  description: driver-service trực tiếp trong mạng cab-internal / local dev (cổng hiện tại của project; không publish ra host ở môi trường chuẩn).
  variables:
    port:
      default: '3002'
tags:
- name: Driver Registration
  description: OTP + đăng ký tài xế (UC-06)
- name: Driver Profile
  description: Hồ sơ tài xế (UC-05)
- name: Driver Admin
  description: Admin duyệt hồ sơ (UC-07)
- name: Driver Availability
  description: Trạng thái và vị trí (UC-08)
- name: Driver Nearby
  description: Tìm tài xế gần (UC-09)
- name: Internal
  description: Internal REST do driver-service cung cấp (INT-03/04/05/08)
- name: Health
  description: Liveness/readiness
x-kafka-events:
  description: 'Hợp đồng Kafka (event-driven) của service — KHÔNG phải HTTP endpoint (docx §10). Nguồn: SRS §12.1–12.3, micro §7. Envelope: EventEnvelope. Outbox/inbox at-least-once, manual commit, retry 1/5/25s rồi vào cab.dead-letter.'
  envelope:
    $ref: '#/components/schemas/EventEnvelope'
  produces:
  - eventType: driver.application.decided
    topic: driver.events
    partitionKey: driverId
    consumers:
    - identity-service
    - notification-service
    payload:
      $ref: '#/components/schemas/DriverApplicationDecidedPayload'
  - eventType: driver.location.updated
    topic: driver.events
    partitionKey: driverId
    consumers:
    - trip-service
    payload:
      $ref: '#/components/schemas/DriverLocationUpdatedPayload'
  consumes:
  - eventType: booking.assigned
    topic: booking.events
    producer: booking-service
    consumerGroup: driver-service.v1
    payload:
      $ref: '#/components/schemas/BookingAssignedPayload'
  - eventType: booking.canceled
    topic: booking.events
    producer: booking-service
    consumerGroup: driver-service.v1
    payload:
      $ref: '#/components/schemas/BookingCanceledPayload'
    effect: Release reservation đã giữ (nếu có reservationId) (SRS §6.8).
  - eventType: trip.assigned
    topic: trip.events
    producer: trip-service
    consumerGroup: driver-service.v1
    payload:
      $ref: '#/components/schemas/TripAssignedPayload'
    effect: Cập nhật Driver BUSY/activeTripId theo version; trip.assigned cũ không đổi ngược BUSY khi Trip đã kết thúc (SRS §12.3).
  - eventType: trip.completed
    topic: trip.events
    producer: trip-service
    consumerGroup: driver-service.v1
    payload:
      $ref: '#/components/schemas/TripCompletedPayload'
    effect: Giải phóng Driver BUSY→ONLINE đúng activeTripId (SRS §6.7).
  - eventType: trip.canceled
    topic: trip.events
    producer: trip-service
    consumerGroup: driver-service.v1
    payload:
      $ref: '#/components/schemas/TripCanceledPayload'
    effect: Release reservation đúng tripId, Driver BUSY→ONLINE (SRS §6.8).
  - eventType: trip.review.created
    topic: trip.events
    producer: trip-service
    consumerGroup: driver-service.v1
    payload:
      $ref: '#/components/schemas/TripReviewCreatedPayload'
    effect: Inbox dedupe theo eventId TRƯỚC khi cộng ratingSum/ratingCount (SRS §6.9.3).
x-outgoing-internal-calls:
- code: INT-02
  target: identity-service
  call: POST /internal/accounts/drivers
  when: Khi nộp hồ sơ đăng ký Driver (SRS §6.2).
paths:
  /drivers/{id}:
    get:
      tags:
      - Driver Profile
      operationId: getDriver
      summary: Xem hồ sơ tài xế
      description: So khớp path `{id}` với `JWT.profileId`. Owner/ADMIN nhận DriverProfileFull; CUSTOMER chỉ nhận DriverProfilePublic (email/phone/CCCD không trả). Driver khác → 403 (FR-05, UC-05).
      x-api-type: public
      x-source: SRS.md §8.3 UC-05, §9 FR-05, §16.2, §16.2.1 AUD-22; microservice_design.md §5.4.2, §9.4.1
      x-roles:
      - DRIVER(owner)
      - CUSTOMER(public fields)
      - ADMIN
      x-grpc-rpc: cab.driver.v1.DriverService/GetDriver
      parameters:
      - name: id
        in: path
        required: true
        description: Driver ID (profileId)
        schema:
          type: string
          format: uuid
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Hồ sơ theo vai trò.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/DriverProfileFull'
                - $ref: '#/components/schemas/DriverProfilePublic'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /drivers/otp/request:
    post:
      tags:
      - Driver Registration
      operationId: requestDriverOtp
      summary: Yêu cầu OTP đăng ký Driver
      description: Tạo OTP (hash trong DB, TTL 5 phút, TTL index Redis); SMS adapter mock gửi mã (không gọi notification-service). Sandbox mã cố định 123456. RATE_OTP 3/5 phút/phone+IP.
      x-api-type: public
      x-source: SRS.md §6.2, §8.3 UC-06, §16.1 OTP_*/RATE_OTP, §16.2; microservice_design.md §5.4.2, §6.2, §10.4
      x-roles:
      - PUBLIC
      x-grpc-rpc: cab.driver.v1.DriverService/RequestOtp
      x-todo: 'Chưa xác định trong SRS/microservice_design: mã lỗi khi phone đã dùng (UC-06 chỉ ghi tiền điều kiện ''Phone chưa dùng'')'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequest'
            example:
              phone: '+84912345678'
              purpose: DRIVER_REGISTRATION
      security: []
      responses:
        '202':
          description: Đã tạo challenge.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpRequestResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /drivers/otp/verify:
    post:
      tags:
      - Driver Registration
      operationId: verifyDriverOtp
      summary: Xác minh OTP và nhận registrationToken
      description: Verify code (≤5 lần thử, trước expiry 5 phút). Thành công trả registrationToken (replay verify lại trả cùng token). OTP sai/hết hạn → 422; quá số lần thử → 429.
      x-api-type: public
      x-source: SRS.md §6.2, §8.3 UC-06, §16.2, §16.2.1; microservice_design.md §5.4.2, §6.2, §9.6.3
      x-roles:
      - PUBLIC
      x-grpc-rpc: cab.driver.v1.DriverService/VerifyOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
            example:
              challengeId: 00000000-0000-4000-8000-000000000000
              phone: '+84912345678'
              code: '123456'
      security: []
      responses:
        '200':
          description: registrationToken (JWT HS256, TTL 15 phút).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpVerifyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          description: 422 — OTP sai/hết hạn.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /drivers/register:
    post:
      tags:
      - Driver Registration
      operationId: registerDriver
      summary: Nộp hồ sơ đăng ký Driver
      description: Nhận hồ sơ CCCD/bằng lái/xe cùng registrationToken; mã hóa CCCD/bằng lái; gọi INT-02 tạo Account; lưu Driver `PENDING_APPROVAL` (FR-07). Replay cùng Idempotency-Key + body trả kết quả cũ kể cả token đã hết hạn sau lần nhận hợp lệ; token dùng cho operation/key khác → 401; thiếu giấy tờ → 400.
      x-api-type: public
      x-source: SRS.md §6.2, §8.3 UC-06, §16.2, §16.2.1; microservice_design.md §5.4.2, §6.2, §9.6.3
      x-roles:
      - PUBLIC + registrationToken
      x-grpc-rpc: cab.driver.v1.DriverService/RegisterDriver
      x-todo: 'Chưa xác định trong SRS/microservice_design: vị trí truyền registrationToken (header Authorization Bearer hay field body) — SRS chỉ ghi ''PUBLIC + registrationToken'''
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverRegisterRequest'
            example:
              phone: '+84912345678'
              password: Secret123
              fullName: Tran Van B
              citizenId: 079012345678
              licenseNumber: B2-123456
              vehicleType: BIKE
              plate: 59A1-12345
              vehicleModel: Honda Wave
      security:
      - registrationToken: []
      responses:
        '201':
          description: Hồ sơ PENDING_APPROVAL; Account chờ duyệt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverRegisterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: 409 — Request cùng Idempotency-Key đang xử lý (IN_PROGRESS) hoặc xung đột nghiệp vụ (BRULE-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 422 — Cùng Idempotency-Key nhưng body khác (BRULE-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /drivers/me/application:
    get:
      tags:
      - Driver Registration
      operationId: getMyApplication
      summary: Xem hồ sơ/trạng thái duyệt của mình
      description: Driver (kể cả scope hạn chế `driver.application.read` khi PENDING_APPROVAL/REJECTED) xem trạng thái hồ sơ của mình (FR-08).
      x-api-type: public
      x-source: SRS.md §8.3 UC-06, §9 FR-08, §16.2, §16.2.1; microservice_design.md §5.4.2
      x-roles:
      - DRIVER(owner; cho phép scope hạn chế)
      x-grpc-rpc: cab.driver.v1.DriverService/GetMyApplication
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Hồ sơ/trạng thái duyệt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverApplication'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/drivers:
    get:
      tags:
      - Driver Admin
      operationId: adminListDrivers
      summary: 'Admin: danh sách hồ sơ Driver'
      description: Danh sách phân trang hồ sơ Driver; mặc định mục đích là hồ sơ chờ duyệt (`status?`).
      x-api-type: public
      x-source: SRS.md §6.3, §8.3 UC-07, §9 FR-09, §16.2; microservice_design.md §5.4.2
      x-roles:
      - ADMIN
      x-grpc-rpc: cab.driver.v1.DriverService/ListDriverApplications
      x-todo: 'Chưa xác định trong SRS/microservice_design: tập giá trị hợp lệ và giá trị mặc định của tham số `status` (SRS chỉ ghi ''status?'')'
      parameters:
      - name: status
        in: query
        required: false
        description: Lọc theo status hồ sơ (vd PENDING_APPROVAL).
        schema:
          type: string
          enum:
          - PENDING_APPROVAL
          - OFFLINE
          - REJECTED
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Danh sách phân trang.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverApplicationPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/drivers/{id}:
    get:
      tags:
      - Driver Admin
      operationId: adminGetDriver
      summary: 'Admin: chi tiết hồ sơ Driver'
      description: Hồ sơ/giấy tờ/xe của Driver; CCCD/bằng lái masked.
      x-api-type: public
      x-source: SRS.md §6.3, §8.3 UC-07, §9 FR-09, §16.2, §16.4; microservice_design.md §5.4.2
      x-roles:
      - ADMIN
      x-grpc-rpc: cab.driver.v1.DriverService/GetDriverApplication
      parameters:
      - name: id
        in: path
        required: true
        description: Driver ID (profileId)
        schema:
          type: string
          format: uuid
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Chi tiết hồ sơ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDriverDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/drivers/{id}/approve:
    post:
      tags:
      - Driver Admin
      operationId: adminApproveDriver
      summary: 'Admin: duyệt hồ sơ Driver'
      description: Chỉ khi Driver `PENDING_APPROVAL`. Ghi decision=APPROVE, profile → OFFLINE, outbox `driver.application.decided` (Identity kích hoạt Account, Notification báo kết quả). Replay cùng key trả response cũ. Không còn chờ → 409; role khác → 403.
      x-api-type: public
      x-source: SRS.md §6.3, §8.3 UC-07, §9 FR-10, §16.2; microservice_design.md §5.4.2, §6.3
      x-roles:
      - ADMIN
      x-grpc-rpc: cab.driver.v1.DriverService/ApproveDriver
      parameters:
      - name: id
        in: path
        required: true
        description: Driver ID (profileId)
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Driver OFFLINE; event đã vào outbox.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverDecisionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 409 — Request cùng Idempotency-Key đang xử lý (IN_PROGRESS) hoặc xung đột nghiệp vụ (BRULE-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 422 — Cùng Idempotency-Key nhưng body khác (BRULE-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/drivers/{id}/reject:
    post:
      tags:
      - Driver Admin
      operationId: adminRejectDriver
      summary: 'Admin: từ chối hồ sơ Driver'
      description: Chỉ khi Driver `PENDING_APPROVAL`; reason bắt buộc (thiếu → 400). Lưu người/thời gian/lý do; Driver → REJECTED; outbox `driver.application.decided`.
      x-api-type: public
      x-source: SRS.md §6.3, §8.3 UC-07, §9 FR-10, §16.2; microservice_design.md §5.4.2, §6.3
      x-roles:
      - ADMIN
      x-grpc-rpc: cab.driver.v1.DriverService/RejectDriver
      parameters:
      - name: id
        in: path
        required: true
        description: Driver ID (profileId)
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectDriverRequest'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Driver REJECTED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverDecisionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 409 — Request cùng Idempotency-Key đang xử lý (IN_PROGRESS) hoặc xung đột nghiệp vụ (BRULE-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 422 — Cùng Idempotency-Key nhưng body khác (BRULE-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /drivers/me/availability:
    put:
      tags:
      - Driver Availability
      operationId: setAvailability
      summary: Đặt ONLINE/OFFLINE
      description: Chỉ DRIVER có accountStatus=ACTIVE và application decision=APPROVE (SRS §16.2 'Quyền'); chưa duyệt → 403 (SEC-06). ONLINE yêu cầu Account ACTIVE và vị trí đủ mới (≤ LOCATION_MAX_AGE 60s). BUSY không do client đặt; đang BUSY đổi availability → 409. ONLINE→OFFLINE khi còn Offer PENDING/reservation HELD → 409 `ACTIVE_OFFER_EXISTS`. Vị trí thiếu/quá cũ → 422. Tự idempotent, KHÔNG cần Idempotency-Key (SEC-08).
      x-api-type: public
      x-source: SRS.md §6.4, §8.3 UC-08, §9 FR-11, §10 BRULE-06, §16.2, §16.2.1; microservice_design.md §5.4.2
      x-roles:
      - DRIVER(accountStatus=ACTIVE, decision=APPROVE)
      x-grpc-rpc: cab.driver.v1.DriverService/SetAvailability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetAvailabilityRequest'
            example:
              status: ONLINE
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Availability ghi nhận.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 409 — Driver BUSY hoặc ACTIVE_OFFER_EXISTS.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 422 — Vị trí thiếu/quá cũ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /drivers/me/location:
    put:
      tags:
      - Driver Availability
      operationId: updateLocation
      summary: Cập nhật vị trí
      description: Chỉ DRIVER có accountStatus=ACTIVE và application decision=APPROVE (SRS §16.2 'Quyền'); chưa duyệt → 403 (SEC-06). Lưu DB (nguồn bền vững) + Redis GEO, phát `driver.location.updated` (outbox) cho trip-service. RATE_LOCATION 12/phút/userId. Tự idempotent theo thời gian, KHÔNG cần Idempotency-Key.
      x-api-type: public
      x-source: SRS.md §6.4, §8.3 UC-08, §9 FR-12, §16.1 RATE_LOCATION, §16.2; microservice_design.md §5.4.2, §6.4
      x-roles:
      - DRIVER(accountStatus=ACTIVE, decision=APPROVE)
      x-grpc-rpc: cab.driver.v1.DriverService/UpdateLocation
      x-todo: 'Chưa xác định trong SRS/microservice_design: body response 200 của PUT /drivers/me/location và hành vi khi recordedAt thiếu'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLocationRequest'
            example:
              lat: 10.7735
              lng: 106.699
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Vị trí đã lưu; event phát qua outbox.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /drivers/nearby:
    get:
      tags:
