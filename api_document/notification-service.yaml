# notification-service — OpenAPI contract (generated; nguồn: SRS.md v3.6, microservice_design.md v3.7)
openapi: 3.0.3
info:
  title: CAB System — notification-service
  version: 1.0.0
  description: |-
    API contract của **notification-service** — Notification (BC09, MongoDB cab_notification_db, replica-set transaction): consume Kafka, lưu inbox của người nhận, đánh dấu đã đọc. Inbox là nguồn sự thật; push chỉ là delivery.

    Actor: CUSTOMER/DRIVER (owner) xem và đánh dấu đọc thông báo của mình.

    Nguồn duy nhất: `SRS.md` (v3.6) và `microservice_design.md` (v3.7). Mọi operation có `x-source`; chi tiết chưa xác định được đánh dấu `x-todo`. YAML này là contract để implement (docx: 1 service = 1 YAML).

    Quy ước chung: JSON camelCase; ID UUID; thời gian UTC; tiền VND (bigint); error envelope `{error:{code,message},requestId}`; `X-Request-Id` xuyên REST/Kafka/log (NFR-02). Rate limit tại Gateway: vượt ngưỡng trả 429 + Retry-After (SEC-07); mặc định RATE_GENERAL 100/phút/userId (public theo IP) áp dụng cho mọi route — 429 chỉ được liệt kê riêng ở endpoint có cấu hình rate riêng. `x-api-type`: public = client gọi qua Gateway; internal = service↔service (/internal/**, Gateway trả 404 cho client); health = liveness/readiness có credential. `x-grpc-rpc` = RPC mà Gateway dùng để chuyển route này tới service (micro §2.6.3).
servers:
- url: http://localhost:{port}
  description: API Gateway (local development) — điểm vào của client/frontend cho public API (SRS §16.2).
  variables:
    port:
      default: '8000'
- url: http://localhost:{port}
  description: notification-service trực tiếp trong mạng cab-internal / local dev (cổng hiện tại của project; không publish ra host ở môi trường chuẩn).
  variables:
    port:
      default: '3006'
tags:
- name: Notification
  description: Inbox thông báo (UC-19)
- name: Health
  description: Liveness/readiness
x-kafka-events:
  description: 'Hợp đồng Kafka (event-driven) của service — KHÔNG phải HTTP endpoint (docx §10). Nguồn: SRS §12.1–12.3, micro §7. Envelope: EventEnvelope. Outbox/inbox at-least-once, manual commit, retry 1/5/25s rồi vào cab.dead-letter.'
  envelope:
    $ref: '#/components/schemas/EventEnvelope'
  produces: []
  consumes:
  - eventType: driver.application.decided
    topic: driver.events
    producer: driver-service
    consumerGroup: notification-service.v1
    payload:
      $ref: '#/components/schemas/DriverApplicationDecidedPayload'
    effect: 'Inbox DRIVER/driverId: kết quả duyệt/từ chối hồ sơ.'
  - eventType: booking.offer.created
    topic: booking.events
    producer: booking-service
    consumerGroup: notification-service.v1
    payload:
      $ref: '#/components/schemas/BookingOfferCreatedPayload'
    effect: 'Inbox DRIVER/driverId: Offer có chuyến.'
  - eventType: booking.assigned
    topic: booking.events
    producer: booking-service
    consumerGroup: notification-service.v1
    payload:
      $ref: '#/components/schemas/BookingAssignedPayload'
    effect: Chỉ nhận để projection/log; KHÔNG tạo inbox trùng với trip.assigned (SRS §12.3.1).
  - eventType: booking.canceled
    topic: booking.events
    producer: booking-service
    consumerGroup: notification-service.v1
    payload:
      $ref: '#/components/schemas/BookingCanceledPayload'
    effect: Inbox CUSTOMER/customerId; thêm DRIVER/driverId nếu Offer đã gửi.
  - eventType: booking.no_driver_found
    topic: booking.events
    producer: booking-service
    consumerGroup: notification-service.v1
    payload:
      $ref: '#/components/schemas/BookingNoDriverFoundPayload'
    effect: Inbox CUSTOMER/customerId.
  - eventType: trip.assigned
    topic: trip.events
    producer: trip-service
    consumerGroup: notification-service.v1
    payload:
      $ref: '#/components/schemas/TripAssignedPayload'
    effect: Inbox CUSTOMER/customerId và DRIVER/driverId (gán chuyến + snapshot tài xế).
  - eventType: trip.status.changed
    topic: trip.events
    producer: trip-service
    consumerGroup: notification-service.v1
    payload:
      $ref: '#/components/schemas/TripStatusChangedPayload'
    effect: Inbox CUSTOMER/customerId (ARRIVED/IN_PROGRESS).
  - eventType: trip.completed
    topic: trip.events
    producer: trip-service
    consumerGroup: notification-service.v1
    payload:
      $ref: '#/components/schemas/TripCompletedPayload'
    effect: Inbox CUSTOMER/customerId và DRIVER/driverId.
  - eventType: trip.canceled
    topic: trip.events
    producer: trip-service
    consumerGroup: notification-service.v1
    payload:
      $ref: '#/components/schemas/TripCanceledPayload'
    effect: Inbox CUSTOMER/customerId và DRIVER/driverId (kèm lý do).
  - eventType: payment.completed
    topic: payment.events
    producer: payment-service
    consumerGroup: notification-service.v1
    payload:
      $ref: '#/components/schemas/PaymentCompletedPayload'
    effect: Inbox CUSTOMER/customerId.
  - eventType: payment.failed
    topic: payment.events
    producer: payment-service
    consumerGroup: notification-service.v1
    payload:
      $ref: '#/components/schemas/PaymentFailedPayload'
    effect: Inbox CUSTOMER/customerId.
  producesNote: Không có event nghiệp vụ nào được catalog nguồn chốt cho service này; không tự tạo topic/event mới (micro §5.x.5).
paths:
  /notifications:
    get:
      tags:
      - Notification
      operationId: listNotifications
      summary: Danh sách thông báo của mình
      description: Lọc theo (recipient_role, recipient_id) = (JWT.role, JWT.profileId); không so profileId với JWT.sub. Driver PENDING_APPROVAL/REJECTED vẫn xem được inbox (scope notifications.read). ADMIN không dùng inbox P1 (chưa có recipient mapping).
      x-api-type: public
      x-source: SRS.md §6.9.4, §8.3 UC-19, §9 FR-30, §12.3, §16.2, §16.2.1; microservice_design.md §5.8.2, §6.11
      x-roles:
      - CUSTOMER(owner)
      - DRIVER(owner, scope hợp lệ)
      x-grpc-rpc: cab.notification.v1.NotificationService/ListNotifications
      parameters:
      - name: unread
        in: query
        required: false
        schema:
          type: boolean
        description: true → chỉ thông báo chưa đọc
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Danh sách phân trang.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /notifications/{id}/read:
    patch:
      tags:
      - Notification
      operationId: markNotificationRead
      summary: Đánh dấu đã đọc
      description: Cập nhật read_at idempotent; đọc lặp không tạo side effect mới. Khác recipient → 403.
      x-api-type: public
      x-source: SRS.md §8.3 UC-19, §9 FR-30, §16.2; microservice_design.md §5.8.2
      x-roles:
      - CUSTOMER(owner)
      - DRIVER(owner, scope hợp lệ)
      x-grpc-rpc: cab.notification.v1.NotificationService/MarkRead
      x-todo: 'Chưa xác định trong SRS/microservice_design: body response 200 (SRS chỉ ghi ''200''); đang trả Notification'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Notification ID
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Thông báo sau khi đánh dấu đọc.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /health:
    get:
      tags:
      - Health
      operationId: health
      summary: Liveness
      description: 'Liveness: process sống; không gọi DB/Kafka/Redis (SRS §16.2.1 ''Ràng buộc ghi, bảo mật và readiness''). Health nội bộ có credential (micro §9.5).'
      x-api-type: health
      x-source: SRS.md §16.0 NFR-01, §16.2.1; microservice_design.md §5.x.3, §9.5
      x-roles:
      - INTERNAL (X-Service-Token)
      x-todo: 'Chưa xác định trong SRS/microservice_design: response body của /health và /ready từng service không được tài liệu định nghĩa (chỉ /health/services của Gateway có schema {services,checkedAt})'
      security:
      - serviceToken: []
      servers:
      - url: http://localhost:{port}
        description: notification-service trực tiếp trong mạng cab-internal / local dev (cổng hiện tại của project; không publish ra host ở môi trường chuẩn).
        variables:
          port:
            default: '3006'
      responses:
        '200':
          description: Process còn sống.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /ready:
    get:
      tags:
      - Health
      operationId: ready
      summary: Readiness
      description: 'Readiness: kiểm MongoDB (replica-set/transaction) và Kafka (NFR-01). Dependency DOWN → 503 (UC-01 AC-01.2, NFR-01). Runtime phải chứng minh 503 rồi hồi phục 200 khi dependency lên lại (SRS §16.2.1).'
      x-api-type: health
      x-source: SRS.md §8.3 UC-01, §16.0 NFR-01, §16.2.1; microservice_design.md §9.5
      x-roles:
      - INTERNAL (X-Service-Token)
      x-todo: 'Chưa xác định trong SRS/microservice_design: response body của /health và /ready từng service không được tài liệu định nghĩa (chỉ /health/services của Gateway có schema {services,checkedAt})'
      security:
      - serviceToken: []
      servers:
      - url: http://localhost:{port}
        description: notification-service trực tiếp trong mạng cab-internal / local dev (cổng hiện tại của project; không publish ra host ở môi trường chuẩn).
        variables:
          port:
            default: '3006'
      responses:
        '200':
          description: Sẵn sàng.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  schemas:
    BookingAssignedPayload:
      type: object
      required:
      - bookingId
      - tripId
      - driverId
      - customerId
      properties:
        bookingId:
          type: string
          format: uuid
        tripId:
          type: string
          format: uuid
        driverId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
    BookingCanceledPayload:
      type: object
      required:
      - bookingId
      - customerId
      - reason
      properties:
        bookingId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        driverId:
          type: string
          format: uuid
          description: Có khi Offer đã gửi
        reason:
          type: string
        reservationId:
          type: string
          format: uuid
    BookingNoDriverFoundPayload:
      type: object
      required:
      - bookingId
      - customerId
      properties:
        bookingId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
    BookingOfferCreatedPayload:
      type: object
      required:
      - offerId
      - bookingId
      - driverId
      - customerId
      - pickup
      - dropoff
      - expiresAt
      properties:
        offerId:
          type: string
          format: uuid
        bookingId:
          type: string
          format: uuid
        driverId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        pickup:
          $ref: '#/components/schemas/Coordinate'
        dropoff:
          $ref: '#/components/schemas/Coordinate'
        expiresAt:
          type: string
          format: date-time
    Coordinate:
      type: object
      description: Điểm đón/trả {lat,lng,address?} (SRS §16.2.1 DTO Tọa độ). Phải nằm trong SERVICE_AREA lat 10.35–11.20, lng 106.35–107.05 (SRS §16.1); ngoài vùng trả 422 (BRULE-08) nên KHÔNG đặt minimum/maximum trong schema để Swagger không đổi thành 400.
      required:
      - lat
      - lng
      properties:
        lat:
          type: number
          description: Vĩ độ; số hữu hạn (không chuỗi/NaN).
        lng:
          type: number
          description: Kinh độ; số hữu hạn (không chuỗi/NaN).
        address:
          type: string
          description: Địa chỉ (tùy chọn). Free-text được escape tại output (SEC-04).
    DriverApplicationDecidedPayload:
      type: object
      required:
      - driverId
      - accountId
      - decision
      properties:
        driverId:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
          description: users.id của Account — dùng cho Identity activation
        decision:
          type: string
          enum:
          - APPROVE
          - REJECT
        reason:
          type: string
          description: Lý do từ chối (khi REJECT)
    DriverSnapshot:
      type: object
      description: Driver snapshot {driverId,fullName,plate,vehicleType,ratingAverage} (SRS §16.2.1). Không chứa CCCD/password.
      required:
      - driverId
      - fullName
      - plate
      - vehicleType
      - ratingAverage
      properties:
        driverId:
          type: string
          format: uuid
        fullName:
          type: string
        plate:
          type: string
          description: Biển số xe
        vehicleType:
          $ref: '#/components/schemas/VehicleType'
        ratingAverage:
          type: number
          description: Điểm đánh giá trung bình
    ErrorResponse:
      type: object
      description: Error envelope chuẩn {error:{code,message},requestId} (SRS §16.2.1 'Lỗi').
      required:
      - error
      - requestId
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              description: 'Mã lỗi nghiệp vụ. Các mã có căn cứ trong tài liệu: MISSING_IDEMPOTENCY_KEY, ACTIVE_OFFER_EXISTS, TRIP_ALREADY_CREATED, TARIFF_NOT_CONFIGURED. Các mã khác chưa được tài liệu liệt kê nên không đặt enum.'
            message:
              type: string
              description: Mô tả lỗi; không chứa SQL/stack trace/token/giấy tờ (SEC-10).
        requestId:
          type: string
          description: X-Request-Id/correlationId của request (NFR-02).
    EventEnvelope:
      type: object
      description: Envelope Kafka (SRS §12.2; micro §7.3). Nếu ghi ở schema khác thì lấy SRS làm chuẩn.
      required:
      - eventId
      - eventType
      - version
      - aggregateId
      - aggregateVersion
      - occurredAt
      - producer
      - correlationId
      - payload
      properties:
        eventId:
          type: string
          format: uuid
        eventType:
          type: string
          description: Dotted event name, vd trip.completed
        version:
          type: integer
          description: Version schema của envelope/payload (không phải TTL/config)
        aggregateId:
          type: string
          description: ID aggregate (vd tripId)
        aggregateVersion:
          type: integer
          description: Version aggregate của owner producer
        occurredAt:
          type: string
          format: date-time
          description: UTC ISO-8601
        producer:
          type: string
          description: Service producer, vd trip-service
        correlationId:
          type: string
          description: requestId
        payload:
          type: object
          description: Payload theo từng eventType; không chứa password/token/CCCD/phone plaintext.
    Fare:
      type: object
      description: Fare chính thức do trip-service tính và khóa lúc tạo Trip (SRS §16.2.1 Trip/Fare, BRULE-09).
      required:
      - amountVnd
      - currency
      - tariffVersion
      properties:
        amountVnd:
          type: integer
          description: Số tiền VND (bigint).
          format: int64
        currency:
          type: string
          enum:
          - VND
        tariffVersion:
          type: string
          description: Phiên bản tariff đã khóa (vd demo-v1 — micro §9.6.6 G03).
    Notification:
      type: object
      description: '{id,type,title,body,resource,readAt,createdAt} (SRS §16.2.1). Không chứa giấy tờ/OTP/password.'
      required:
      - id
      - type
      - title
      - body
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          description: Loại thông báo (theo event type)
        title:
          type: string
        body:
          type: string
        resource:
          type: object
          additionalProperties: true
          description: Tham chiếu tài nguyên liên quan.
        readAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
      x-todo: 'Chưa xác định trong SRS/microservice_design: kiểu dữ liệu và cấu trúc của `resource`, danh sách giá trị `type`/nội dung title-body'
    NotificationPage:
      type: object
      description: Phân trang chuẩn {items,page,limit,total} (SRS §16.2.1, BRULE-23). page vượt tổng trả items:[].
      required:
      - items
      - page
      - limit
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        page:
          type: integer
          description: Trang hiện tại
          minimum: 1
        limit:
          type: integer
          description: Số phần tử tối đa mỗi trang
          minimum: 1
          maximum: 50
        total:
          type: integer
          description: Tổng số kết quả sau authorization/filter, trước khi cắt trang (SRS §16.2.1)
          minimum: 0
    PaymentCompletedPayload:
      type: object
      required:
      - paymentId
      - tripId
      - customerId
      - amountVnd
      - paidAt
      properties:
        paymentId:
          type: string
          format: uuid
        tripId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        amountVnd:
          type: integer
          format: int64
        paidAt:
          type: string
          format: date-time
    PaymentFailedPayload:
      type: object
      required:
      - paymentId
      - tripId
      - customerId
      - reason
      properties:
        paymentId:
          type: string
          format: uuid
        tripId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        reason:
          type: string
    TripAssignedPayload:
      type: object
      required:
      - tripId
      - bookingId
      - customerId
      - driverId
      - driverSnapshot
      - fare
      properties:
        tripId:
          type: string
          format: uuid
        bookingId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        driverId:
          type: string
          format: uuid
        driverSnapshot:
          $ref: '#/components/schemas/DriverSnapshot'
        fare:
          $ref: '#/components/schemas/Fare'
    TripCanceledPayload:
      type: object
      required:
      - tripId
      - bookingId
      - customerId
      - driverId
      - reason
      - canceledBy
      properties:
        tripId:
          type: string
          format: uuid
        bookingId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        driverId:
          type: string
          format: uuid
        reason:
          type: string
        canceledBy:
          type: string
          description: 'Ai hủy. Chưa xác định trong SRS/microservice_design: tập giá trị canceledBy'
    TripCompletedPayload:
      type: object
      required:
      - tripId
      - bookingId
      - customerId
      - driverId
      - fare
      properties:
        tripId:
          type: string
          format: uuid
        bookingId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        driverId:
          type: string
          format: uuid
        fare:
          $ref: '#/components/schemas/Fare'
    TripStatus:
      type: string
      description: Trạng thái Trip (SRS §7).
      enum:
      - ASSIGNED
      - ARRIVED
      - IN_PROGRESS
      - COMPLETED
      - CANCELED
    TripStatusChangedPayload:
      type: object
      required:
      - tripId
      - customerId
      - driverId
      - from
      - to
      properties:
        tripId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        driverId:
          type: string
          format: uuid
        from:
          $ref: '#/components/schemas/TripStatus'
        to:
          $ref: '#/components/schemas/TripStatus'
    VehicleType:
      type: string
      description: Loại xe (allowlist BIKE/SEDAN/SUV — SRS §16.2.1).
      enum:
      - BIKE
      - SEDAN
      - SUV
  responses:
    BadRequest:
      description: 400 — Validation không hợp lệ, thiếu Idempotency-Key (MISSING_IDEMPOTENCY_KEY) hoặc client gửi trường không được phép (SRS §16.2 bảng mã HTTP).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 403 — Sai role, quyền sở hữu hoặc caller (SEC-06).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 404 — Không tìm thấy tài nguyên (SRS §16.2 bảng mã HTTP).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: 503 — Dependency unavailable; không suy diễn timeout = thất bại nghiệp vụ (SRS §16.2, NFR-07).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: 401 — Token/credential/chữ ký/timestamp không hợp lệ; sửa sub/role hoặc alg=none (SEC-05).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: Số phần tử mỗi trang (LIMIT_DEFAULT=20, LIMIT_MAX=50). Ngoài biên → 400.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    Page:
      name: page
      in: query
      required: false
      description: Số trang (PAGE_DEFAULT=1). Giá trị không hợp lệ → 400.
      schema:
        type: integer
        minimum: 1
        default: 1
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Access JWT RS256 do identity-service cấp (TTL 60 phút). Claims: iss, aud, sub (=users.id), role, profileId, accountStatus, scope, iat, exp, jti (SRS §16.2.1). Driver PENDING_APPROVAL/REJECTED chỉ có scope driver.application.read và notifications.read.'
    serviceToken:
      type: apiKey
      in: header
      name: X-Service-Token
      description: 'Internal REST credential: JWT HS256 với claims iss (service gọi), aud (service nhận), iat, exp (TTL 60s), jti (SRS §14.1, micro §2.3). Thiếu/sai → 401; caller không nằm trong allowlist → 403. Chỉ tồn tại trên mạng cab-internal; Gateway trả 404 cho mọi /internal/** từ client.'
