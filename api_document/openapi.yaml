      summary: Xử lý sự cố
      description: 'UC-17.2. Tiền điều kiện: Incident OPEN/IN_PROGRESS; version đúng. Hậu điều kiện thành công: RESOLVED/CLOSED;
        có thể phát terminate/fare-review.'
      x-api-id: API-29
      x-uc: UC-17.2
      x-roles:
      - OPERATOR
      x-fr:
      - FR-34
      - FR-35
      - FR-41
      - FR-44
      - FR-55
      x-dec:
      - DEC-20
      - DEC-21
      - DEC-22
      - DEC-34
      x-brule:
      - BRULE-12
      - BRULE-14
      x-idempotency: key+version
      x-rate-limit: 100/min/user
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ResourceId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncidentUpdate'
            example:
              status: RESOLVED
              resolution: CONTINUE_TRIP
              note: Đã hỗ trợ thay xe
              version: 3
      responses:
        '200':
          description: RESOLVED/CLOSED; có thể phát terminate/fare-review
          content:
            application/json:
              schema:
