        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /ride-requests:
    post:
      tags:
      - Ride
      operationId: createRideRequest
      summary: Tạo yêu cầu đặt xe
      description: 'UC-05.1. Tiền điều kiện: đã xác thực; điểm trong vùng; không request/trip mở. Hậu điều kiện thành công:
        RideRequest SEARCHING và giá ước tính.'
