        nhật nguyên tử.'
      x-api-id: API-14
      x-uc: UC-09.1
      x-roles:
      - DRIVER
      x-fr:
      - FR-17
      - FR-18
      - FR-19
      - FR-20
      - FR-21
      - FR-22
      - FR-41
      x-dec:
      - DEC-34
      x-brule:
      - BRULE-07
      x-idempotency: key+version
      x-rate-limit: 100/min/user
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ResourceId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
