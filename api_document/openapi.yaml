        ACCEPT/DECLINE theo quy tắc cạnh tranh.'
      x-api-id: API-13
      x-uc: UC-07.1/07.2
      x-roles:
      - DRIVER
      x-fr:
      - FR-13
      - FR-14
      x-dec:
      - DEC-16
      - DEC-17
      - DEC-34
      x-brule:
      - BRULE-06
      - BRULE-07
      x-idempotency: key+version
