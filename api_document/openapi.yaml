        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /operations/accounts/{id}/unlock:
    post:
      tags:
      - Identity&Driver
      operationId: unlockAccount
      summary: Khóa hoặc mở tài khoản
      description: 'UC-16.5. Tiền điều kiện: target CUSTOMER/DRIVER; có quyền. Hậu điều kiện thành công: Đổi User status,
        thu hồi token khi khóa, audit.'
      x-api-id: API-10
