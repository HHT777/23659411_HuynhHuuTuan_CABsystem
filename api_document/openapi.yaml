      x-uc: UC-05.1
      x-roles:
      - CUSTOMER
      x-fr: &id007
      - FR-07
      - FR-08
      - FR-09
      - FR-40
      - FR-48
      - FR-50
      x-dec: &id008
      - DEC-19
      - DEC-23
      - DEC-34
      x-brule: &id009
