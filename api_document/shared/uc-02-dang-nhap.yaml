/auth/login:
  post:
    tags:
    - Identity&Driver
    operationId: login
    summary: Đăng nhập
    description: 'UC-02. Tiền điều kiện: tài khoản ACTIVE, chưa bị khóa đăng nhập. Hậu điều kiện thành công: Cấp access/refresh
      token.'
    x-api-id: API-03
    x-uc: UC-02
    x-roles:
    - Public
    x-fr: &id001
    - FR-04
    - FR-49
    - FR-50
    - FR-51
    x-dec: &id002
    - DEC-29
    - DEC-30
    x-brule: &id003
    - BRULE-01
    x-idempotency: none
    x-rate-limit: 10/min/IP
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../_common/schemas.yaml#/LoginRequest
          example:
            phone: '+84901234567'
            password: CabPilot2026
    responses:
      '200':
        description: Cấp access/refresh token
        content:
          application/json:
            schema:
              $ref: ../_common/schemas.yaml#/AuthTokens
            example:
              accessToken: access-token-pilot-2026-abcdefgh
              refreshToken: refresh-token-pilot-2026-abcdefgh
              tokenType: Bearer
              expiresIn: 900
      '401':
        $ref: ../_common/errors.yaml#/Unauthorized
      '423':
        $ref: ../_common/errors.yaml#/Locked
      '429':
        $ref: ../_common/errors.yaml#/TooManyRequests
/auth/refresh:
  post:
    tags:
    - Identity&Driver
    operationId: refreshToken
    summary: Đăng nhập
    description: 'UC-02. Tiền điều kiện: tài khoản ACTIVE, chưa bị khóa đăng nhập. Hậu điều kiện thành công: Cấp access/refresh
      token.'
    x-api-id: API-04
    x-uc: UC-02
    x-roles:
    - Authenticated
    x-fr: *id001
    x-dec: *id002
    x-brule: *id003
    x-idempotency: key
    x-rate-limit: 100/min/user
    security:
    - bearerAuth: []
    parameters:
    - $ref: ../_common/parameters.yaml#/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../_common/schemas.yaml#/RefreshRequest
          example:
            refreshToken: refresh-token-pilot-2026-abcdef
    responses:
      '200':
        description: Cấp access/refresh token
        content:
          application/json:
            schema:
              $ref: ../_common/schemas.yaml#/AuthTokens
            example:
              accessToken: access-token-pilot-2026-abcdefgh
              refreshToken: refresh-token-pilot-2026-abcdefgh
              tokenType: Bearer
              expiresIn: 900
      '401':
        $ref: ../_common/errors.yaml#/Unauthorized
      '409':
        $ref: ../_common/errors.yaml#/Conflict
      '429':
        $ref: ../_common/errors.yaml#/TooManyRequests
