components:
  schemas:
    ActiveTrip:
      type: object
      required:
      - tripId
      - status
      properties:
        tripId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/TripStatus'
      x-todo: 'Chưa xác định trong SRS/microservice_design: response INT-07 (tài liệu chỉ ghi ''Xác nhận không có Trip hoạt động'')'
    CancelTripRequest:
      type: object
      required:
      - reason
      properties:
        reason:
          type: string
          description: Lý do (bắt buộc); tối đa COMMENT_REASON_MAX=500 ký tự (BRULE-16); escape HTML tại output.
          minLength: 1
          maxLength: 500
    Coordinate:
      type: object
      description: Điểm đón/trả {lat,lng,address?} (SRS §16.2.1 DTO Tọa độ). Phải nằm trong SERVICE_AREA lat 10.35–11.20, lng 106.35–107.05 (SRS §16.1); ngoài vùng trả 422 (BRULE-08) nên KHÔNG đặt minimum/maximum trong schema để Swagger không đổi thành 400.
      required:
      - lat
      - lng
      properties:
        lat:
          type: number
          description: Vĩ độ; số hữu hạn (không chuỗi/NaN).
        lng:
          type: number
          description: Kinh độ; số hữu hạn (không chuỗi/NaN).
        address:
          type: string
          description: Địa chỉ (tùy chọn). Free-text được escape tại output (SEC-04).
    CreateReviewRequest:
      type: object
      description: Body review (stars,comment).
      required:
      - stars
      properties:
        stars:
          type: integer
          description: Số nguyên 1–5 (BRULE-17)
          minimum: 1
          maximum: 5
        comment:
          type: string
          description: Tối đa 500 ký tự; lưu raw, escape tại output (XSS)
          maxLength: 500
    CreateTripInternalRequest:
      type: object
      description: Body INT-06 (SRS §6.6).
      required:
      - bookingId
      - offerId
      - reservationId
      - customerId
      - driverId
      - pickup
      - dropoff
      - vehicleType
      - commandKey
      properties:
        bookingId:
