        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 409 — Reservation sai/hết hạn (từ INT-08) hoặc xung đột Trip hoạt động.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /internal/customers/{id}/active-trip:
    get:
      tags:
      - Internal
      operationId: internalGetActiveTrip
      summary: '[INT-07] Kiểm Trip hoạt động của Customer'
      description: booking-service xác nhận Customer không có Trip hoạt động (ASSIGNED/ARRIVED/IN_PROGRESS) trước khi tạo Booking. Timeout/404 không chứng minh operation cũ không thể commit (micro §9.6.2).
      x-api-type: internal
      x-internal-contract: INT-07
      x-allowed-callers:
      - booking-service
      x-source: SRS.md §14.1 INT-07; microservice_design.md §2.4 INT-07, §5.6.3, §9.6.2
      x-roles:
      - 'INTERNAL: booking-service'
      x-todo: 'Chưa xác định trong SRS/microservice_design: response INT-07: có Trip hoạt động → 200 + body? không có → 404 hay 200 rỗng?'
      parameters:
