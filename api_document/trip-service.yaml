        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /internal/trips:
    post:
      tags:
      - Internal
      operationId: internalCreateTrip
      summary: '[INT-06] Tạo/phục hồi Trip'
      description: booking-service gọi khi Driver accept. Trip tra idempotency/booking_id TRƯỚC confirm reservation (INT-08), tính & khóa Fare, tạo Trip ASSIGNED + `trip.assigned` trong một transaction. 201 lần đầu; replay cùng bookingId/commandKey trả response cũ; không tạo mới khi kết quả chưa rõ.
      x-api-type: internal
      x-internal-contract: INT-06
      x-allowed-callers:
      - booking-service
      x-source: SRS.md §6.6, §14.1 INT-06; microservice_design.md §2.4 INT-06, §5.6.3, §6.6, §9.6.2
      x-roles:
      - 'INTERNAL: booking-service'
      x-todo: 'Chưa xác định trong SRS/microservice_design: status code replay (tài liệu: ''replay response cũ'') và mã lỗi chi tiết'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTripInternalRequest'
      security:
      - serviceToken: []
      servers:
      - url: http://localhost:{port}
        description: trip-service trực tiếp trong mạng cab-internal / local dev (cổng hiện tại của project; không publish ra host ở môi trường chuẩn).
        variables:
