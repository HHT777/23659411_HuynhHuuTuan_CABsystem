# trip-service — OpenAPI contract (generated; nguồn: SRS.md v3.6, microservice_design.md v3.7)
openapi: 3.0.3
info:
  title: CAB System — trip-service
  version: 1.0.0
  description: |-
    API contract của **trip-service** — Trip Operations + Fare + Feedback (BC06/BC08, PostgreSQL cab_trip_db; Redis cache vị trí): vòng đời Trip, tính/khóa Fare, Review, danh mục giá (price_versions).

    Actor: CUSTOMER/DRIVER (owner), ADMIN; internal caller: booking-service, payment-service.

    Nguồn duy nhất: `SRS.md` (v3.6) và `microservice_design.md` (v3.7). Mọi operation có `x-source`; chi tiết chưa xác định được đánh dấu `x-todo`. YAML này là contract để implement (docx: 1 service = 1 YAML).

    Quy ước chung: JSON camelCase; ID UUID; thời gian UTC; tiền VND (bigint); error envelope `{error:{code,message},requestId}`; `X-Request-Id` xuyên REST/Kafka/log (NFR-02). Rate limit tại Gateway: vượt ngưỡng trả 429 + Retry-After (SEC-07); mặc định RATE_GENERAL 100/phút/userId (public theo IP) áp dụng cho mọi route — 429 chỉ được liệt kê riêng ở endpoint có cấu hình rate riêng. `x-api-type`: public = client gọi qua Gateway; internal = service↔service (/internal/**, Gateway trả 404 cho client); health = liveness/readiness có credential. `x-grpc-rpc` = RPC mà Gateway dùng để chuyển route này tới service (micro §2.6.3).
servers:
- url: http://localhost:{port}
  description: API Gateway (local development) — điểm vào của client/frontend cho public API (SRS §16.2).
  variables:
    port:
      default: '8000'
- url: http://localhost:{port}
  description: trip-service trực tiếp trong mạng cab-internal / local dev (cổng hiện tại của project; không publish ra host ở môi trường chuẩn).
  variables:
    port:
      default: '3004'
tags:
- name: Trip
  description: Vòng đời Trip, hủy (UC-13/14/15)
- name: Review
  description: Đánh giá chuyến (UC-16)
- name: Internal
  description: Internal REST do trip-service cung cấp (INT-06/07/09)
- name: Health
  description: Liveness/readiness
x-kafka-events:
  description: 'Hợp đồng Kafka (event-driven) của service — KHÔNG phải HTTP endpoint (docx §10). Nguồn: SRS §12.1–12.3, micro §7. Envelope: EventEnvelope. Outbox/inbox at-least-once, manual commit, retry 1/5/25s rồi vào cab.dead-letter.'
  envelope:
    $ref: '#/components/schemas/EventEnvelope'
  produces:
  - eventType: trip.assigned
    topic: trip.events
    partitionKey: tripId
    consumers:
    - booking-service
    - driver-service
    - notification-service
    payload:
      $ref: '#/components/schemas/TripAssignedPayload'
  - eventType: trip.status.changed
    topic: trip.events
    partitionKey: tripId
    consumers:
    - notification-service
    payload:
      $ref: '#/components/schemas/TripStatusChangedPayload'
  - eventType: trip.completed
    topic: trip.events
    partitionKey: tripId
    consumers:
    - booking-service
    - driver-service
    - notification-service
    payload:
      $ref: '#/components/schemas/TripCompletedPayload'
  - eventType: trip.canceled
    topic: trip.events
    partitionKey: tripId
    consumers:
    - booking-service
    - driver-service
    - notification-service
    payload:
      $ref: '#/components/schemas/TripCanceledPayload'
  - eventType: trip.review.created
    topic: trip.events
    partitionKey: driverId
    consumers:
    - driver-service
    payload:
      $ref: '#/components/schemas/TripReviewCreatedPayload'
  consumes:
  - eventType: driver.location.updated
    topic: driver.events
    producer: driver-service
    consumerGroup: trip-service.v1
    payload:
      $ref: '#/components/schemas/DriverLocationUpdatedPayload'
    effect: Cập nhật vị trí Trip IN_PROGRESS (last_lat/lng) + cache Redis; chỉ áp event có recordedAt/version Driver mới hơn (SRS §6.7, BRULE-14).
  - eventType: payment.completed
    topic: payment.events
    producer: payment-service
    consumerGroup: trip-service.v1
    payload:
      $ref: '#/components/schemas/PaymentCompletedPayload'
    effect: Ghi Trip.paymentStatus = PAID (UNPAID→PAID), không hạ trạng thái (SRS §6.9.2).
x-outgoing-internal-calls:
- code: INT-08
  target: driver-service
  call: POST /internal/drivers/{id}/reservations/{reservationId}/confirm
  when: Khi xử lý INT-06 (confirm reservation trước khi tạo Trip).
paths:
  /trips/{id}:
    get:
      tags:
      - Trip
      operationId: getTrip
      summary: Xem Trip
      description: 'Snapshot tài xế, trạng thái, vị trí, fare, paymentStatus. Chỉ Customer/Driver liên quan (owner) hoặc ADMIN. Kafka lag: đọc owner để xác nhận (UC-14).'
      x-api-type: public
      x-source: SRS.md §8.3 UC-13/14, §9 FR-20, §16.2, §16.2.1; microservice_design.md §5.6.2
      x-roles:
      - CUSTOMER(owner)
      - DRIVER(owner)
      - ADMIN
      x-grpc-rpc: cab.trip.v1.TripService/GetTrip
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Trip ID
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Trip.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /trips/{id}/status:
    patch:
      tags:
      - Trip
      operationId: updateTripStatus
      summary: 'Driver: cập nhật trạng thái Trip'
      description: ASSIGNED→ARRIVED→IN_PROGRESS→COMPLETED; transition + outbox nguyên tử (`trip.status.changed`, `trip.completed` kèm Fare). Nhảy bước → 409; Driver không được gán → 403. Tự idempotent theo trạng thái, KHÔNG cần Idempotency-Key.
      x-api-type: public
      x-source: SRS.md §6.7, §8.3 UC-14, §9 FR-21, §16.2, §16.2.1; microservice_design.md §5.6.2, §6.7
      x-roles:
      - DRIVER(assigned)
      x-grpc-rpc: cab.trip.v1.TripService/UpdateTripStatus
      x-todo: 'Chưa xác định trong SRS/microservice_design: body response 200 của PATCH status (SRS chỉ ghi ''200''); đang trả Trip'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Trip ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTripStatusRequest'
            example:
              status: ARRIVED
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Trip sau khi đổi trạng thái.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 409 — Sai thứ tự chuyển trạng thái.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /trips/{id}/cancel:
    post:
      tags:
      - Trip
      operationId: cancelTrip
      summary: Hủy Trip
      description: Customer chủ Trip hoặc Driver được gán hủy Trip `ASSIGNED`/`ARRIVED`; lưu CANCELED, canceledBy, reason; phát `trip.canceled`. Từ `IN_PROGRESS` trở đi → 409. Không tự điều phối lại; không có Payment cho Trip hủy.
      x-api-type: public
      x-source: SRS.md §6.8, §8.3 UC-15, §9 FR-23, §10 BRULE-15/16, §16.2; microservice_design.md §5.6.2, §6.8
      x-roles:
      - CUSTOMER(owner)
      - DRIVER(owner)
      x-grpc-rpc: cab.trip.v1.TripService/CancelTrip
      x-todo: 'Chưa xác định trong SRS/microservice_design: body response 200 của cancel Trip (SRS chỉ ghi ''200 CANCELED''); đang trả Trip'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Trip ID
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelTripRequest'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Trip CANCELED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 409 — Request cùng Idempotency-Key đang xử lý (IN_PROGRESS) hoặc xung đột nghiệp vụ (BRULE-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 422 — Cùng Idempotency-Key nhưng body khác (BRULE-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /trips/{id}/reviews:
    post:
      tags:
      - Review
      operationId: createReview
      summary: 'Customer: đánh giá Trip'
      description: 'Customer chủ Trip `COMPLETED` đánh giá một lần: stars 1–5, comment ≤500 (escape output). Phát `trip.review.created`. Stars ngoài biên → 400; trùng → 409.'
      x-api-type: public
      x-source: SRS.md §6.9.3, §8.3 UC-16, §9 FR-24, §10 BRULE-17, §16.2; microservice_design.md §5.6.2, §6.10
      x-roles:
      - CUSTOMER(owner)
      x-grpc-rpc: cab.trip.v1.TripService/CreateReview
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Trip ID
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReviewRequest'
            example:
              stars: 5
              comment: Tai xe than thien
      security:
      - bearerAuth: []
      responses:
        '201':
          description: Review gắn tripId.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 409 — Request cùng Idempotency-Key đang xử lý (IN_PROGRESS) hoặc xung đột nghiệp vụ (BRULE-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 422 — Cùng Idempotency-Key nhưng body khác (BRULE-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /trips/{id}/review:
    get:
      tags:
      - Review
      operationId: getReview
      summary: Xem Review của Trip
      description: Theo quyền đọc Trip liên quan. Chưa có Review → 404.
      x-api-type: public
      x-source: SRS.md §9 FR-25, §16.2, §16.2.1; microservice_design.md §5.6.2
      x-roles:
      - CUSTOMER(owner)
      - DRIVER(owner)
