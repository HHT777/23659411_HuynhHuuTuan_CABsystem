                $ref: '#/components/schemas/ErrorResponse'
  /internal/trips/{id}/payable:
    get:
      tags:
      - Internal
      operationId: internalGetTripPayable
      summary: '[INT-09] Thông tin thanh toán của Trip'
      description: payment-service đọc customerId, status, fare (khóa), paymentStatus để tạo Payment; nguồn xác nhận số tiền (thay hoàn toàn INT-10). Payment đối chiếu customerId với JWT.profileId.
      x-api-type: internal
      x-internal-contract: INT-09
      x-allowed-callers:
