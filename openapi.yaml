openapi: 3.0.3
info:
  title: CAB System API
  version: 1.0.0
  description: Đặc tả API pilot được truy vết từ SRS.md, mục 18.9 và các quy tắc nghiệp vụ liên quan.
  license:
    name: Proprietary
    url: https://cab-system.invalid/license
  x-assumption: SRS không quy định URL giấy phép; miền .invalid được dùng làm placeholder tài liệu và phải được thay trước
    khi phát hành.
servers:
- url: /
  description: Cùng origin với trang tài liệu hoặc API gateway
tags:
- name: Authentication and Accounts
  description: Đăng ký, xác thực và hồ sơ tài khoản.
- name: Driver Profiles and Availability
  description: Hồ sơ và trạng thái sẵn sàng của tài xế.
- name: Ride Requests
  description: Tiếp nhận và tra cứu yêu cầu chuyến.
- name: Driver Matching and Dispatch
  description: Đề nghị chuyến và phản hồi của tài xế; thuật toán ghép chạy nội bộ.
- name: Trips and Tracking
  description: Vòng đời chuyến và theo dõi vị trí.
- name: Fare and Payments
  description: Cước chuyến và thanh toán.
- name: Notifications
  description: Thông báo in-app.
- name: Trip History and Ratings
  description: Lịch sử chuyến và đánh giá tài xế.
- name: Operations and Incident Support
  description: Quản lý vận hành, phân quyền, bảng giá và sự cố.
- name: Reporting
  description: Báo cáo vận hành tổng hợp.
security:
- bearerAuth: []
paths:
  /api/v1/auth/register:
    post:
      tags:
      - Authentication and Accounts
      operationId: registerCustomer
      summary: Đăng ký khách hàng
      description: Tạo tài khoản khách hàng bằng số điện thoại duy nhất.
      x-srs-ref: UC-01; FR-01; BRULE-01
      x-roles:
      - PUBLIC
      responses:
        '201':
          description: Tài khoản đã được tạo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security: []
      requestBody:
        required: true
        description: Dữ liệu yêu cầu.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
            example:
              phone: '+84901234567'
              name: Nguyễn Văn An
              password: Cab@123456
  /api/v1/auth/login:
    post:
      tags:
      - Authentication and Accounts
      operationId: login
      summary: Đăng nhập
      description: Xác thực tài khoản và phát access token 30 phút cùng refresh token 7 ngày.
      x-srs-ref: UC-02; FR-04; BRULE-01
      x-roles:
      - PUBLIC
      responses:
        '200':
          description: Đăng nhập thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokensResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security: []
      requestBody:
        required: true
        description: Dữ liệu yêu cầu.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              phone: '+84901234567'
              password: Cab@123456
  /api/v1/auth/refresh:
    post:
      tags:
      - Authentication and Accounts
      operationId: refreshAccessToken
      summary: Làm mới token
      description: Xoay vòng refresh token và cấp access token mới.
      x-srs-ref: UC-02; FR-04; BRULE-01
      x-roles:
      - PUBLIC
      responses:
        '200':
          description: Token mới đã được cấp.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokensResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security: []
      requestBody:
        required: true
        description: Dữ liệu yêu cầu.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
            example:
              refreshToken: eyJhbGciOiJIUzI1NiJ9.refresh
  /api/v1/auth/logout:
    post:
      tags:
      - Authentication and Accounts
      operationId: logout
      summary: Đăng xuất
      description: Thu hồi refresh token của phiên hiện tại.
      x-srs-ref: UC-02; FR-04; BRULE-01
      x-roles:
      - CUSTOMER
      - DRIVER
      - OPERATOR
      - ADMIN
      - EXECUTIVE
      responses:
        '204':
          description: Đăng xuất thành công, không có nội dung.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/me/profile:
    get:
      tags:
      - Authentication and Accounts
      operationId: getMyProfile
      summary: Xem hồ sơ của tôi
      description: Trả hồ sơ thuộc tài khoản đang xác thực.
      x-srs-ref: UC-03; FR-05; BRULE-01
      x-roles:
      - CUSTOMER
      - DRIVER
      - OPERATOR
      - ADMIN
      - EXECUTIVE
      responses:
        '200': &id001
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags:
      - Authentication and Accounts
      operationId: updateMyProfile
      summary: Cập nhật hồ sơ của tôi
      description: Cập nhật tên hoặc số điện thoại; số điện thoại phải duy nhất.
      x-srs-ref: UC-03; FR-05; BRULE-01
      x-roles:
      - CUSTOMER
      responses:
        '200': *id001
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      requestBody:
        required: true
        description: Dữ liệu yêu cầu.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
            example:
              name: Nguyễn Văn Bình
              phone: '+84987654321'
  /api/v1/drivers/me/availability:
    patch:
      tags:
      - Driver Profiles and Availability
      operationId: updateMyDriverAvailability
      summary: Cập nhật trạng thái nhận chuyến
      description: Tài xế chỉ ONLINE khi hồ sơ và xe hoạt động, đồng thời không có chuyến mở.
      x-srs-ref: UC-04; FR-02; FR-06; BRULE-02
      x-roles:
      - DRIVER
      responses:
        '200': &id008
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      requestBody:
        required: true
        description: Dữ liệu yêu cầu.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverAvailabilityRequest'
            example:
              availability: ONLINE
  /api/v1/drivers/me/offers:
    get:
      tags:
      - Driver Matching and Dispatch
      operationId: listMyRideOffers
      summary: Danh sách đề nghị chuyến
      description: Trả các đề nghị dành cho tài xế; mỗi đề nghị có cửa sổ phản hồi 20 giây.
      x-srs-ref: UC-07; FR-12..FR-14; BRULE-04..BRULE-06
      x-roles:
      - DRIVER
      responses:
        '200':
          description: Danh sách đề nghị.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRideOfferResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters: &id005
      - &id006
        $ref: '#/components/parameters/Page'
      - &id007
        $ref: '#/components/parameters/Size'
  /api/v1/drivers/me/location:
    put:
      tags:
      - Trips and Tracking
      operationId: updateMyDriverLocation
      summary: Cập nhật vị trí tài xế
      description: Ghi nhận vị trí WGS84 mới nhất; khi online hoặc đang chạy chuyến, tối đa 10 giây mỗi lần cập nhật.
      x-srs-ref: UC-08; FR-21; BRULE-04; BRULE-07
      x-roles:
      - DRIVER
      responses:
        '200':
          description: Vị trí đã cập nhật.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverLocationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      requestBody:
        required: true
        description: Dữ liệu yêu cầu.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverLocationRequest'
            example:
              latitude: 10.7769
              longitude: 106.7009
  /api/v1/ride-requests:
    post:
      tags:
      - Ride Requests
      operationId: createRideRequest
      summary: Tạo yêu cầu chuyến
      description: Ghi nhận điểm đón, điểm đến, loại xe và bắt đầu ghép tài xế nội bộ.
      x-srs-ref: UC-05; FR-07..FR-09; BRULE-03; RULE-02
      x-roles:
      - CUSTOMER
      responses:
        '201':
          description: Yêu cầu chuyến đã tạo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideRequestResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        description: Dữ liệu yêu cầu.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RideRequestCreateRequest'
            example:
              pickup:
                latitude: 10.7769
                longitude: 106.7009
                address: 1 Lê Duẩn, Quận 1, TP.HCM
              destination:
                latitude: 10.8022
                longitude: 106.7145
                address: Bình Thạnh, TP.HCM
              vehicleType: MOTORCYCLE
  /api/v1/ride-requests/{id}:
    get:
      tags:
      - Ride Requests
      operationId: getRideRequest
      summary: Xem yêu cầu chuyến
      description: Chỉ khách hàng sở hữu được xem yêu cầu chuyến.
      x-srs-ref: UC-05; FR-08; BRULE-03
      x-roles:
      - CUSTOMER
      responses:
        '200':
          description: Chi tiết yêu cầu chuyến.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideRequestResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters: &id004
      - &id002
        $ref: '#/components/parameters/ResourceId'
  /api/v1/ride-offers/{id}/responses:
    post:
      tags:
      - Driver Matching and Dispatch
      operationId: respondToRideOffer
      summary: Phản hồi đề nghị chuyến
      description: Ghi nhận ACCEPT hoặc DECLINE; ghép chuyến là thao tác nguyên tử và đề nghị hết hạn trả 409.
      x-srs-ref: UC-07; FR-12..FR-15; BRULE-04..BRULE-06; RULE-02
      x-roles:
      - DRIVER
      responses:
        '200': &id003
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
      - *id002
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        description: Dữ liệu yêu cầu.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RideOfferDecisionRequest'
            example:
              decision: ACCEPT
  /api/v1/trips/{id}/status:
    patch:
      tags:
      - Trips and Tracking
      operationId: updateTripStatus
      summary: Cập nhật trạng thái chuyến
      description: Tài xế được gán chuyển trạng thái theo chuỗi ASSIGNED → ARRIVED_AT_PICKUP → PICKED_UP → IN_PROGRESS → COMPLETED.
      x-srs-ref: UC-09; FR-17..FR-22; BRULE-07
      x-roles:
      - DRIVER
      responses:
        '200': *id003
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters: *id004
      requestBody:
        required: true
        description: Dữ liệu yêu cầu.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripStatusUpdateRequest'
            example:
              status: ARRIVED_AT_PICKUP
  /api/v1/trips/{id}/cancellation:
    post:
      tags:
      - Trips and Tracking
      operationId: cancelTrip
      summary: Hủy chuyến
      description: Khách hàng hoặc tài xế được hủy trước PICKED_UP và phải nêu lý do; sau đó chỉ vận hành xử lý qua sự cố
        có audit.
      x-srs-ref: UC-09; FR-17..FR-22; BRULE-07
      x-roles:
      - CUSTOMER
      - DRIVER
      - OPERATOR
      responses:
        '200': *id003
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters: *id004
      requestBody:
        required: true
        description: Dữ liệu yêu cầu.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripCancellationRequest'
            example:
              reason: Khách hàng thay đổi kế hoạch
  /api/v1/trips/{id}:
    get:
      tags:
      - Trips and Tracking
      operationId: getTrip
      summary: Xem chuyến đi
      description: Khách hàng sở hữu, tài xế được gán hoặc vận hành có quyền được xem; ETA có thể null khi thiếu dữ liệu định
        tuyến.
      x-srs-ref: UC-10; FR-21; BRULE-07
      x-roles:
      - CUSTOMER
      - DRIVER
      - OPERATOR
      responses:
        '200': *id003
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters: *id004
  /api/v1/trips/{id}/fare:
    get:
      tags:
      - Fare and Payments
      operationId: getTripFare
      summary: Xem cước chuyến
      description: Trả cước VND đã tính nội bộ; chỉ có sau khi chuyến hoàn thành.
      x-srs-ref: UC-11; FR-23; BRULE-08; BRULE-09
      x-roles:
      - CUSTOMER
      - DRIVER
      - OPERATOR
      responses:
        '200':
          description: Cước chuyến.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FareResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters: *id004
  /api/v1/trips/{id}/payments:
    post:
      tags:
      - Fare and Payments
      operationId: createTripPayment
      summary: Tạo thanh toán chuyến
      description: Tạo thanh toán tiền mặt hoặc điện tử; một chuyến chỉ có tối đa một thanh toán thành công.
      x-srs-ref: UC-12; FR-24..FR-27; BRULE-10; RULE-02
      x-roles:
      - CUSTOMER
      responses:
        '201':
          description: Thanh toán đã tạo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
      parameters:
      - *id002
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        description: Dữ liệu yêu cầu.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCreateRequest'
            example:
              method: ELECTRONIC
    get:
      tags:
      - Fare and Payments
      operationId: getTripPayment
      summary: Xem thanh toán chuyến
      description: Trả trạng thái thanh toán hiện tại của chuyến.
      x-srs-ref: UC-12; FR-24..FR-27; BRULE-10
      x-roles:
      - CUSTOMER
      - DRIVER
      - OPERATOR
      responses:
        '200':
          description: Thanh toán của chuyến.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters: *id004
  /api/v1/payments/provider-callbacks:
    post:
      tags:
      - Fare and Payments
      operationId: receivePaymentProviderCallback
      summary: Nhận callback thanh toán
      description: Nhận callback idempotent từ nhà cung cấp sandbox; chỉ kết quả đã xác minh mới được ghi nhận.
      x-srs-ref: UC-12; FR-25..FR-27; BRULE-10
      x-roles:
      - PAYMENT_PROVIDER
      responses:
        '200':
          description: Callback đã xử lý hoặc đã được xử lý trước đó.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
      security: []
      parameters:
