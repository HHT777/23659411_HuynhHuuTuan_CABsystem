          - CUSTOMER
          - DRIVER
          - OPERATOR
          - ADMIN
          - EXECUTIVE
        createdAt:
          type: string
          description: Thời điểm tạo tài khoản.
          example: '2026-09-24T10:00:00+07:00'
          format: date-time
