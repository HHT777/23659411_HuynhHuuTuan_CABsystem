openapi: 3.0.3
info:
  title: CAB System API
  version: 1.0.0
  description: |-
    Đặc tả API pilot được truy vết từ SRS.md, mục 18.9 và các quy tắc nghiệp vụ liên quan.
    Trên Swagger UI, operation được nhóm theo actor. Đăng nhập bằng `/api/v1/auth/login`, sao chép `accessToken`,
    chọn **Authorize** và nhập `Bearer <accessToken>`. Tag chỉ hỗ trợ điều hướng; `security`, `x-roles`, quyền sở hữu
    và phản hồi 401/403 mới mô tả quyền thực thi.
  license:
    name: Proprietary
    url: https://cab-system.invalid/license
  x-assumption: SRS không quy định URL giấy phép; miền .invalid được dùng làm placeholder tài liệu và phải được thay trước khi phát hành.
servers:
  - url: /
    description: Cùng origin với trang tài liệu hoặc API gateway
security:
  - bearerAuth: []
tags:
  - name: 01 - Công khai và Tích hợp
    description: Đăng ký, đăng nhập và callback sandbox; các operation công khai không dùng bearer token.
  - name: 02 - Khách hàng (CUSTOMER)
    description: API dành cho Khách hàng; dữ liệu chuyến, yêu cầu và thông báo bị giới hạn theo quyền sở hữu.
  - name: 03 - Tài xế (DRIVER)
    description: API dành cho Tài xế; chỉ thao tác hồ sơ của mình, lời mời và chuyến được phân công.
  - name: 04 - Nhân viên vận hành (OPERATOR)
    description: Tra cứu và xử lý tác vụ vận hành theo quyền; không xóa dữ liệu hoặc sửa kết quả thanh toán.
  - name: 05 - Ban lãnh đạo (EXECUTIVE)
    description: Chỉ xem báo cáo được cấp quyền; không có quyền cấu hình hoặc quản trị hệ thống.
  - name: 06 - Quản trị viên (ADMIN)
    description: Quản lý vai trò, bảng giá và tác vụ quản trị nhạy cảm; các thay đổi được audit.
paths:
  /api/v1/auth/register:
    post:
      tags:
        - 01 - Công khai và Tích hợp
      operationId: registerCustomer
      summary: Khách hàng đăng ký tài khoản
      description: Tạo tài khoản khách hàng bằng số điện thoại duy nhất.
      x-srs-ref: UC-01; FR-01; BRULE-01
      x-roles:
        - PUBLIC
      responses:
        '201':
          description: Tài khoản đã được tạo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security: []
      requestBody:
        required: true
        description: Dữ liệu yêu cầu.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
            example:
              phone: '+84901234567'
              name: Nguyễn Văn An
              password: Cab@123456
  /api/v1/auth/login:
    post:
      tags:
        - 01 - Công khai và Tích hợp
      operationId: login
      summary: Đăng nhập và lấy token theo vai trò
      description: Xác thực tài khoản và phát access token 30 phút cùng refresh token 7 ngày.
      x-srs-ref: UC-02; FR-04; BRULE-01
      x-roles:
        - PUBLIC
      responses:
        '200':
          description: Đăng nhập thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokensResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security: []
      requestBody:
        required: true
        description: Dữ liệu yêu cầu.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              phone: '+84901234567'
              password: Cab@123456
  /api/v1/auth/refresh:
    post:
      tags:
        - 01 - Công khai và Tích hợp
      operationId: refreshAccessToken
      summary: Làm mới token
      description: Xoay vòng refresh token và cấp access token mới.
      x-srs-ref: UC-02; FR-04; BRULE-01
      x-roles:
        - PUBLIC
      responses:
        '200':
          description: Token mới đã được cấp.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokensResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security: []
      requestBody:
        required: true
        description: Dữ liệu yêu cầu.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
            example:
              refreshToken: eyJhbGciOiJIUzI1NiJ9.refresh
  /api/v1/auth/logout:
    post:
      tags:
        - 02 - Khách hàng (CUSTOMER)
        - 03 - Tài xế (DRIVER)
        - 04 - Nhân viên vận hành (OPERATOR)
        - 05 - Ban lãnh đạo (EXECUTIVE)
        - 06 - Quản trị viên (ADMIN)
      operationId: logout
      summary: Đăng xuất
      description: Thu hồi refresh token của phiên hiện tại.
      x-srs-ref: UC-02; FR-04; BRULE-01
      x-roles:
        - CUSTOMER
        - DRIVER
        - OPERATOR
        - ADMIN
        - EXECUTIVE
      responses:
        '204':
          description: Đăng xuất thành công, không có nội dung.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/auth/driver-registrations:
    post:
      tags:
        - 01 - Công khai và Tích hợp
      operationId: registerDriver
      summary: Tài xế gửi hồ sơ đăng ký
      description: Tạo tài khoản ở trạng thái PENDING_APPROVAL và hồ sơ PENDING_REVIEW. Tài xế chưa được nhận chuyến cho đến khi Vận hành duyệt.
      x-srs-ref: UC-01; FR-02; FR-03; FR-06; BRULE-01; BRULE-02
      x-roles:
        - PUBLIC
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverRegistrationRequest'
      responses:
        '201':
          description: Hồ sơ đăng ký đã được tiếp nhận để xét duyệt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverApplicationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/me/profile:
    get:
      tags:
        - 02 - Khách hàng (CUSTOMER)
        - 03 - Tài xế (DRIVER)
        - 04 - Nhân viên vận hành (OPERATOR)
        - 05 - Ban lãnh đạo (EXECUTIVE)
        - 06 - Quản trị viên (ADMIN)
      operationId: getMyProfile
      summary: Xem hồ sơ của tôi
      description: Trả hồ sơ thuộc tài khoản đang xác thực.
      x-srs-ref: UC-03; FR-05; BRULE-01
      x-roles:
        - CUSTOMER
        - DRIVER
        - OPERATOR
        - ADMIN
        - EXECUTIVE
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags:
        - 02 - Khách hàng (CUSTOMER)
        - 03 - Tài xế (DRIVER)
      operationId: updateMyProfile
      summary: Cập nhật hồ sơ của tôi
      description: Cập nhật tên hoặc số điện thoại tài khoản chung; số điện thoại phải duy nhất. Hồ sơ nghiệp vụ tài xế dùng API Driver riêng.
      x-srs-ref: UC-03; FR-05; FR-06; BRULE-01
      x-roles:
        - CUSTOMER
        - DRIVER
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      requestBody:
        required: true
        description: Dữ liệu yêu cầu.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
            example:
              name: Nguyễn Văn Bình
              phone: '+84987654321'
  /api/v1/me/trips:
    get:
      tags:
        - 02 - Khách hàng (CUSTOMER)
      operationId: listMyTrips
      summary: Lịch sử chuyến của tôi
      description: Trả lịch sử chuyến có phân trang và lọc thời gian; from bao gồm, to không bao gồm, tối đa 366 ngày.
      x-srs-ref: UC-14; FR-28; FR-29; BRULE-07
      x-roles:
        - CUSTOMER
      responses:
        '200':
          description: Lịch sử chuyến.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTripResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
  /api/v1/drivers/me/availability:
    patch:
      tags:
        - 03 - Tài xế (DRIVER)
      operationId: updateMyDriverAvailability
      summary: Tài xế cập nhật trạng thái nhận chuyến
      description: Tài xế chỉ ONLINE khi đăng ký đã APPROVED, tài khoản/hồ sơ/xe đang hoạt động và không có chuyến mở.
      x-srs-ref: UC-04; FR-02; FR-06; BRULE-02
      x-roles:
        - DRIVER
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      requestBody:
        required: true
        description: Dữ liệu yêu cầu.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverAvailabilityRequest'
            example:
              availability: ONLINE
  /api/v1/drivers/me/offers:
    get:
      tags:
        - 03 - Tài xế (DRIVER)
      operationId: listMyRideOffers
      summary: Tài xế xem danh sách lời mời chuyến
      description: Trả các đề nghị dành cho tài xế; mỗi đề nghị có cửa sổ phản hồi 20 giây.
      x-srs-ref: UC-07; FR-12..FR-14; BRULE-04..BRULE-06
      x-roles:
        - DRIVER
      responses:
        '200':
          description: Danh sách đề nghị.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRideOfferResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
  /api/v1/drivers/me/location:
    put:
      tags:
        - 03 - Tài xế (DRIVER)
      operationId: updateMyDriverLocation
      summary: Tài xế cập nhật vị trí
      description: Ghi nhận vị trí WGS84 mới nhất; khi online hoặc đang chạy chuyến, tối đa 10 giây mỗi lần cập nhật.
      x-srs-ref: UC-08; FR-21; BRULE-04; BRULE-07
      x-roles:
        - DRIVER
      responses:
        '200':
          description: Vị trí đã cập nhật.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverLocationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      requestBody:
        required: true
        description: Dữ liệu yêu cầu.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverLocationRequest'
            example:
              latitude: 10.7769
              longitude: 106.7009
  /api/v1/drivers/me/profile:
    get:
      tags:
        - 03 - Tài xế (DRIVER)
      operationId: getMyDriverProfile
      summary: Tài xế xem hồ sơ nghiệp vụ
      description: Trả hồ sơ nghiệp vụ, trạng thái tài khoản, xét duyệt và sẵn sàng của chính tài xế.
      x-srs-ref: UC-03; FR-06; BRULE-01; BRULE-02
      x-roles:
        - DRIVER
      responses:
        '200':
          description: Hồ sơ tài xế.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags:
        - 03 - Tài xế (DRIVER)
      operationId: updateMyDriverProfile
      summary: Tài xế cập nhật thông tin nghiệp vụ thông thường
      description: Chỉ cập nhật trường không cần xét duyệt. Giấy tờ và phương tiện phải gửi qua change-requests.
      x-srs-ref: UC-03; FR-06; BRULE-01; BRULE-02
      x-roles:
        - DRIVER
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverProfileUpdateRequest'
      responses:
        '200':
          description: Hồ sơ đã cập nhật.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/drivers/me/vehicle:
    get:
      tags:
        - 03 - Tài xế (DRIVER)
      operationId: getMyDriverVehicle
      summary: Tài xế xem phương tiện đang có hiệu lực
      description: Thay đổi phương tiện chưa được duyệt không làm thay đổi dữ liệu trả về tại đây.
      x-srs-ref: UC-03; FR-06; BRULE-02
      x-roles:
        - DRIVER
      responses:
        '200':
          description: Phương tiện đang có hiệu lực.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/drivers/me/change-requests:
    post:
      tags:
        - 03 - Tài xế (DRIVER)
      operationId: createMyDriverChangeRequest
      summary: Tài xế gửi yêu cầu đổi giấy tờ hoặc phương tiện
      description: Dữ liệu đề nghị chưa có hiệu lực cho đến khi Vận hành duyệt. Thời hạn duyệt là TBD.
      x-srs-ref: UC-03; FR-06; FR-35; BRULE-02; BRULE-14
      x-roles:
        - DRIVER
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverChangeRequestCreate'
      responses:
        '201':
          description: Yêu cầu thay đổi đã được ghi nhận.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverChangeRequestResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/ride-requests:
    post:
      tags:
        - 02 - Khách hàng (CUSTOMER)
      operationId: createRideRequest
      summary: Khách hàng tạo yêu cầu đặt xe
      description: Ghi nhận điểm đón, điểm đến, loại xe và bắt đầu ghép tài xế nội bộ.
      x-srs-ref: UC-05; FR-07..FR-09; BRULE-03; RULE-02
      x-roles:
        - CUSTOMER
      responses:
        '201':
          description: Yêu cầu chuyến đã tạo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideRequestResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        description: Dữ liệu yêu cầu.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RideRequestCreateRequest'
            example:
              pickup:
                latitude: 10.7769
                longitude: 106.7009
                address: 1 Lê Duẩn, Quận 1, TP.HCM
              destination:
                latitude: 10.8022
                longitude: 106.7145
                address: Bình Thạnh, TP.HCM
              vehicleType: MOTORCYCLE
  /api/v1/ride-requests/{id}:
    get:
      tags:
        - 02 - Khách hàng (CUSTOMER)
      operationId: getRideRequest
      summary: Khách hàng xem yêu cầu đặt xe
      description: Chỉ khách hàng sở hữu được xem yêu cầu chuyến.
      x-srs-ref: UC-05; FR-08; BRULE-03
      x-roles:
        - CUSTOMER
      responses:
        '200':
          description: Chi tiết yêu cầu chuyến.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideRequestResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
        - $ref: '#/components/parameters/ResourceId'
  /api/v1/ride-requests/{id}/cancellation:
    post:
      tags:
        - 02 - Khách hàng (CUSTOMER)
      operationId: cancelRideRequest
      summary: Khách hàng hủy yêu cầu đang tìm tài xế
      description: |-
        Chỉ chủ sở hữu được hủy khi trạng thái còn SEARCHING. Hủy thành công chuyển yêu cầu sang CANCELLED và dừng matching.
