          pattern: ^[0-9a-fA-F-]{36}$
        phone:
          type: string
          description: Số điện thoại tài khoản.
          example: '+84901234567'
          minLength: 9
          maxLength: 15
          pattern: ^\+?[0-9]{9,15}$
